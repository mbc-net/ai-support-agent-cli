name: CI/CD Pipeline

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [develop, main, beta]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: read
  checks: write
  issues: write
  pull-requests: write
  security-events: write

jobs:
  unit_tests:
    name: Unit Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x, 26.x]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify lockfile integrity
        run: git diff --exit-code package-lock.json

      - name: Build
        run: npm run build

      - name: Type Check
        run: npx tsc --noEmit
        continue-on-error: true

      # 実ゲート。continue-on-error は付けない。
      # 447f0d0 の時点では minimatch の勧告に CJS 互換の修正版が無く、ゲート化すると
      # CI が恒久的に赤になるため意図的に握り潰していたが、その前提は解消済み。
      # 不変条件は __tests__/ci/security-audit-gate.spec.ts で固定している。
      - name: Security Audit (npm)
        run: npm audit --audit-level=high

      - name: Security Scan (Trivy)
        uses: aquasecurity/trivy-action@master
        if: matrix.node-version == '20.x'
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln,secret'
          severity: 'HIGH,CRITICAL'
          format: 'sarif'
          output: 'trivy-results.sarif'
        continue-on-error: true

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: matrix.node-version == '20.x' && (success() || failure())
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true

      - name: Run Unit Tests
        run: |
          setsid npm test &
          TEST_PID=$!
          TEST_PGID=$(ps -o pgid= -p $TEST_PID | tr -d ' ')
          ( sleep 300 && kill -- -$TEST_PGID 2>/dev/null || true ) &
          KILLER_PID=$!
          wait $TEST_PID
          EXIT_CODE=$?
          kill $KILLER_PID 2>/dev/null || true
          exit $EXIT_CODE
        timeout-minutes: 6

  ansible_callback_tests:
    name: Ansible Callback Plugin Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Pinned to the same range as docker/Dockerfile's `ansible-core` install,
      # since CallbackBase's v2_runner_on_*/v2_playbook_on_stats hooks (used by
      # ansible/callback_plugins/json.py) are internal APIs, not covered by
      # ansible-core's semver-ish compatibility promise.
      - name: Install ansible-core
        run: pip install 'ansible-core>=2.16,<2.18'

      # Collections used by ansible/roles/database/tasks/main.yml. Not
      # exercised by test_json_callback.py itself (it only loads json.py
      # directly and never runs the database role), but installed here to
      # mirror docker/Dockerfile's runtime environment as closely as possible.
      - name: Install Ansible collections (ansible.mysql, community.postgresql)
        run: ansible-galaxy collection install ansible.mysql community.postgresql

      # Regression test for the json stdout callback's no_log censorship —
      # see ansible/callback_plugins/tests/test_json_callback.py's module
      # docstring. This is the only thing standing between a broken
      # censorship change and db_root_password leaking into command output,
      # so it must run in CI rather than rely on manual execution.
      - name: Run json callback no_log censorship tests
        run: python3 ansible/callback_plugins/tests/test_json_callback.py -v

  publish:
    name: Publish
    needs: unit_tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
      id-token: write
    # Exposed so the image jobs reuse the exact version and channel decided here.
    # Re-deriving them downstream would let the container tags drift from the npm
    # dist-tags (e.g. a beta release quietly taking over `:latest`).
    outputs:
      version: ${{ steps.version.outputs.version }}
      channel_tag: ${{ steps.release-type.outputs.tag }}
      prerelease: ${{ steps.release-type.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Extract version from tag
        id: version
        run: |
          TAG_NAME=${{ github.ref_name }}
          VERSION=${TAG_NAME#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Update package.json version
        run: npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Determine release type
        id: release-type
        run: |
          if [[ "${{ steps.version.outputs.version }}" == *"beta"* ]]; then
            echo "tag=beta" >> $GITHUB_OUTPUT
            echo "prerelease=true" >> $GITHUB_OUTPUT
          elif [[ "${{ steps.version.outputs.version }}" == *"alpha"* ]]; then
            echo "tag=alpha" >> $GITHUB_OUTPUT
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish to npm (Pre-release)
        if: steps.release-type.outputs.prerelease == 'true'
        run: npm publish --access public --ignore-scripts --tag ${{ steps.release-type.outputs.tag }}
        timeout-minutes: 5

      - name: Publish to npm (Production)
        if: steps.release-type.outputs.prerelease == 'false'
        run: npm publish --access public --ignore-scripts
        timeout-minutes: 5

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: ${{ steps.release-type.outputs.prerelease }}
          body: |
            ## Changes
            See the [CHANGELOG](./CHANGELOG.md) for details.

            ## Installation
            ```bash
            npm install @ai-support-agent/cli@${{ steps.release-type.outputs.tag }}
            ```
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify API of new version
        if: success()
        run: |
          if [ -z "$VERSION_API_URL" ] || [ -z "$VERSION_API_KEY" ]; then
            echo "::warning::AGENT_VERSION_API_URL or AGENT_VERSION_API_KEY is not set. Skipping version notification."
            exit 0
          fi
          RESPONSE=$(curl -s -w "\n%{http_code}" -X PUT "$VERSION_API_URL/api/agent/version" \
            -H "Content-Type: application/json" \
            -H "X-API-Key: $VERSION_API_KEY" \
            -d "{\"channel\":\"${{ steps.release-type.outputs.tag }}\",\"latestVersion\":\"${{ steps.version.outputs.version }}\"}")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          echo "Response: $BODY (HTTP $HTTP_CODE)"
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::Version notification failed with HTTP $HTTP_CODE"
            exit 1
          fi
        env:
          VERSION_API_URL: ${{ secrets.AGENT_VERSION_API_URL }}
          VERSION_API_KEY: ${{ secrets.AGENT_VERSION_API_KEY }}

  # ---------------------------------------------------------------------------
  # Container image (ghcr.io/mbc-net/ai-support-agent-cli)
  #
  # This is the image `manifest-generator.ts` (DEFAULT_AGENT_IMAGE) tells users to
  # run, so it must exist for a generated Deployment to start at all.
  #
  # `needs: publish` is REQUIRED, not cosmetic: docker/Dockerfile installs the CLI
  # with `npm install -g @ai-support-agent/cli@${AGENT_VERSION}`, so the version
  # has to be on the npm registry before the image can be built.
  #
  # Built per-architecture on native runners and joined into one manifest list.
  # The Dockerfile compiles neovim from source and installs a rust toolchain, so
  # emulating arm64 under QEMU in a single job is far too slow.
  # ---------------------------------------------------------------------------
  publish_image:
    name: Publish Image (${{ matrix.platform }})
    needs: publish
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Wait for the version to be resolvable on npm
        # npm publish returning 200 does not mean the version is already served by
        # every registry replica. Building immediately can fail with E404 on a
        # version that was just published.
        run: |
          for i in $(seq 1 30); do
            if npm view "@ai-support-agent/cli@${{ needs.publish.outputs.version }}" version >/dev/null 2>&1; then
              echo "available after ${i} attempt(s)"
              exit 0
            fi
            sleep 10
          done
          echo "::error::@ai-support-agent/cli@${{ needs.publish.outputs.version }} did not become available on npm"
          exit 1

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            AGENT_VERSION=${{ needs.publish.outputs.version }}
          provenance: false
          outputs: type=image,name=ghcr.io/mbc-net/ai-support-agent-cli,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Save digest for the merge job
        run: |
          mkdir -p /tmp/digests
          echo "${{ steps.build.outputs.digest }}" > "/tmp/digests/${{ matrix.arch }}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/${{ matrix.arch }}
          retention-days: 1

  # Joins the per-architecture images into a single multi-arch manifest list and
  # applies the human-facing tags. `latest` only moves on a production release so
  # a beta tag cannot take it over — mirrors the npm dist-tag logic above.
  publish_image_manifest:
    name: Publish Image Manifest
    # `publish` is listed so its outputs (version / channel_tag) are reachable;
    # `publish_image` is the actual build dependency.
    needs: [publish, publish_image]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: /tmp/digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        env:
          IMAGE: ghcr.io/mbc-net/ai-support-agent-cli
          VERSION: ${{ needs.publish.outputs.version }}
          CHANNEL_TAG: ${{ needs.publish.outputs.channel_tag }}
        run: |
          sources=()
          for f in /tmp/digests/*; do
            sources+=("${IMAGE}@$(cat "$f")")
          done
          if [ ${#sources[@]} -eq 0 ]; then
            echo "::error::no per-architecture digests were produced"
            exit 1
          fi
          # Immutable version tag: always published.
          docker buildx imagetools create --tag "${IMAGE}:${VERSION}" "${sources[@]}"
          # Moving channel tag: latest / beta / alpha, matching the npm dist-tag
          # decided by the publish job. `latest` therefore only moves on a
          # production release.
          docker buildx imagetools create --tag "${IMAGE}:${CHANNEL_TAG}" "${sources[@]}"

      - name: Show published image
        env:
          IMAGE: ghcr.io/mbc-net/ai-support-agent-cli
          VERSION: ${{ needs.publish.outputs.version }}
        run: docker buildx imagetools inspect "${IMAGE}:${VERSION}"
