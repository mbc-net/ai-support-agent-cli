name: CI/CD Pipeline

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [develop, main, beta]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: read
  checks: write
  issues: write
  pull-requests: write
  security-events: write

jobs:
  unit_tests:
    name: Unit Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x, 26.x]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify lockfile integrity
        run: git diff --exit-code package-lock.json

      - name: Build
        run: npm run build

      - name: Type Check
        run: npx tsc --noEmit
        continue-on-error: true

      # 実ゲート。continue-on-error は付けない。
      # 447f0d0 の時点では minimatch の勧告に CJS 互換の修正版が無く、ゲート化すると
      # CI が恒久的に赤になるため意図的に握り潰していたが、その前提は解消済み。
      # npm audit には勧告単位の除外が無いため、.github/scripts/npm-audit-gate.js が
      # `npm audit --json` を解釈して判定する。修正版のない勧告に限り
      # .github/npm-audit-exclusions.json へ「GHSA ID＋パッケージ名＋理由＋期限(expires)」で
      # 期限付き除外を登録できる。期限切れの除外・どの勧告にも一致しない除外・
      # 除外されていない high 以上の勧告はいずれも失敗になる（ゲート自体は外さない）。
      # 除外の前提（修正版が未公開・dev 依存のみ）は reason の記述に頼らず機械的に検査する:
      #   - `npm view <pkg> versions --json` の安定版のうち、range 内の最古版より新しく range 外の版が
      #     1 つでもあれば（＝修正版公開済み。保守ラインの修正版も含む）失敗。range がどの安定版にも
      #     一致しなければ検証不能として失敗。
      #     npm の fixAvailable は修正版の無い braces でも true を返すため使わない
      #   - 除外した勧告が `npm audit --omit=dev --json` にも現れたら（＝本番依存に到達）失敗
      #   - いずれも照会・解釈に失敗したら失敗（fail closed）
      # 不変条件は __tests__/ci/security-audit-gate.spec.ts で固定している。
      - name: Security Audit (npm)
        run: node .github/scripts/npm-audit-gate.js --audit-level=high

      - name: Security Scan (Trivy)
        uses: aquasecurity/trivy-action@master
        if: matrix.node-version == '20.x'
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln,secret'
          severity: 'HIGH,CRITICAL'
          format: 'sarif'
          output: 'trivy-results.sarif'
        continue-on-error: true

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: matrix.node-version == '20.x' && (success() || failure())
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true

      - name: Run Unit Tests
        run: |
          setsid npm test &
          TEST_PID=$!
          TEST_PGID=$(ps -o pgid= -p $TEST_PID | tr -d ' ')
          ( sleep 300 && kill -- -$TEST_PGID 2>/dev/null || true ) &
          KILLER_PID=$!
          wait $TEST_PID
          EXIT_CODE=$?
          kill $KILLER_PID 2>/dev/null || true
          exit $EXIT_CODE
        timeout-minutes: 6

  ansible_callback_tests:
    name: Ansible Callback Plugin Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Pinned to the same range as docker/Dockerfile's `ansible-core` install,
      # since CallbackBase's v2_runner_on_*/v2_playbook_on_stats hooks (used by
      # ansible/callback_plugins/json.py) are internal APIs, not covered by
      # ansible-core's semver-ish compatibility promise.
      - name: Install ansible-core
        run: pip install 'ansible-core>=2.16,<2.18'

      # Collections used by ansible/roles/database/tasks/main.yml. Not
      # exercised by test_json_callback.py itself (it only loads json.py
      # directly and never runs the database role), but installed here to
      # mirror docker/Dockerfile's runtime environment as closely as possible.
      - name: Install Ansible collections (ansible.mysql, community.postgresql)
        run: ansible-galaxy collection install ansible.mysql community.postgresql

      # Regression test for the json stdout callback's no_log censorship —
      # see ansible/callback_plugins/tests/test_json_callback.py's module
      # docstring. This is the only thing standing between a broken
      # censorship change and db_root_password leaking into command output,
      # so it must run in CI rather than rely on manual execution.
      - name: Run json callback no_log censorship tests
        run: python3 ansible/callback_plugins/tests/test_json_callback.py -v

  # ---------------------------------------------------------------------------
  # Channel locks (release channels: latest / beta / alpha)
  #
  # The workflow-level concurrency group is per ref, so runs of DIFFERENT tags
  # are not serialized. Every update of a channel therefore runs under its own
  # per-channel job-level lock (cancel-in-progress: false), one per thing moved:
  #   release-channel-npm-<ch>     publish           npm dist-tag <ch>: decided by
  #                                                  npm-publish-tag.js and written by
  #                                                  `npm publish --tag`; only ever moves
  #                                                  forward (an older release never
  #                                                  takes the channel)
  #   release-channel-image-<ch>   move_channel_tag  GHCR :<ch>, reconciled to npm's holder
  #   release-channel-notify-<ch>  notify_version    API "latest version", reconciled to
  #                                                  npm's holder
  # npm's holder H is the single source of truth and is monotonic, so the two
  # downstream jobs only ever converge to it (npm-channel-target.js).
  #
  # Cancellation: a concurrency group keeps one running + ONE pending job; a
  # newly queued job cancels the pending one.
  #   - downstream jobs: harmless, every job reconciles to npm's current holder
  #     (see the comments on notify_version / move_channel_tag);
  #   - publish: the cancelled release is NOT published, its downstream jobs are
  #     skipped, and a cancelled job alone does not make the run fail, so no
  #     failure notification would go out. report_publish_cancelled therefore
  #     runs exactly when publish ended "cancelled" and fails the run with an
  #     ::error:: naming the tag. Re-run it ("Re-run all jobs"): safe because
  #     publish is idempotent (gitHead check -> skip) and the dist-tag decision
  #     is monotonic.
  #   All registry reads that decide anything (the published check, the publish
  #   dist-tag decision and both downstream holder reads) use the uncached
  #   endpoints in .github/scripts/npm-dist-tags.js (/<pkg>/<version> and
  #   /-/package/<pkg>/dist-tags), never the `npm view` packument, which the CDN
  #   caches for up to 300 s. So a re-run right after a publish sees it.
  # ---------------------------------------------------------------------------
  publish:
    name: Publish
    needs: unit_tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
      id-token: write
    # Per-channel lock around npm's channel dist-tag (see the "Channel locks"
    # comment above). Evaluated before any step runs, so the channel is derived
    # from the tag name with the same rule as the "Determine release type" step
    # (contains() is case-insensitive; that step matches case-insensitively too
    # and fails if the two ever disagree).
    concurrency:
      group: release-channel-npm-${{ contains(github.ref_name, 'beta') && 'beta' || (contains(github.ref_name, 'alpha') && 'alpha' || 'latest') }}
      cancel-in-progress: false
    # Exposed so the image jobs reuse the exact version and channel decided here.
    # Re-deriving them downstream would let the container tags drift from the npm
    # dist-tags (e.g. a beta release quietly taking over `:latest`).
    outputs:
      version: ${{ steps.version.outputs.version }}
      channel_tag: ${{ steps.release-type.outputs.tag }}
      prerelease: ${{ steps.release-type.outputs.prerelease }}
      # Deliberately NOTHING about which version the channel should hold: "Re-run
      # failed jobs" does not re-run this (successful) job and reuses its old
      # outputs, so such a value would be stale on a re-run after a newer release.
      # version / channel_tag are derived from the tag name alone, so reusing them
      # on a re-run is safe. notify_version and move_channel_tag resolve the
      # channel's target from npm themselves, under a per-channel lock
      # (.github/scripts/npm-channel-target.js).
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Extract version from tag
        id: version
        run: |
          TAG_NAME=${{ github.ref_name }}
          VERSION=${TAG_NAME#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Update package.json version
        run: npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version

      # LOCK_CHANNEL is the job's concurrency group expression, verbatim. If this
      # classification and the lock ever disagreed, the job would hold another
      # channel's lock while publishing to this one, so that fails here.
      - name: Determine release type
        id: release-type
        env:
          VERSION: ${{ steps.version.outputs.version }}
          LOCK_CHANNEL: ${{ contains(github.ref_name, 'beta') && 'beta' || (contains(github.ref_name, 'alpha') && 'alpha' || 'latest') }}
        run: |
          shopt -s nocasematch
          if [[ "$VERSION" == *beta* ]]; then
            tag=beta prerelease=true
          elif [[ "$VERSION" == *alpha* ]]; then
            tag=alpha prerelease=true
          else
            tag=latest prerelease=false
          fi
          if [[ "$tag" != "$LOCK_CHANNEL" ]]; then
            echo "::error::release type '$tag' does not match the channel lock '$LOCK_CHANNEL'"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      # Makes the publish job re-runnable. npm can never overwrite a published
      # version (E403), so after a run that published but failed in a later step,
      # a re-run used to fail here forever. The script reads the uncached
      # per-version manifest (GET registry.npmjs.org/<pkg>/<version>, not the
      # CDN-cached `npm view` packument, so a re-run within 300 s of the publish
      # still sees it) and compares its `gitHead` with $GITHUB_SHA: npm records
      # the checkout's HEAD as gitHead on publish, and
      # `npm version --no-git-tag-version` above does not move HEAD, so a match
      # proves the version came from this very commit.
      #   200, same commit -> skip=true (re-run; the publish steps are skipped)
      #   404              -> skip=false (publish)
      #   200 with another/missing gitHead, any other status, bad body,
      #   timeout or connection error -> the step fails
      - name: Check whether this version is already on npm
        id: published
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: node .github/scripts/npm-version-published.js --package=@ai-support-agent/cli --version="$VERSION"

      # Monotonic channel: decides the dist-tag npm publish attaches, under this
      # job's channel lock (.github/scripts/npm-publish-tag.js). With P = npm's
      # current dist-tags[channel] (read uncached) and V = this version:
      #   not yet published: P missing or P < V -> publish_tag=<channel>
      #                      P > V -> publish_tag=superseded-<channel> (an older
      #                      release never takes the channel)
      #   re-run (skip=true): P >= V -> ok; P missing or P < V -> fail with the
      #                      manual `npm dist-tag add` command (the channel was
      #                      changed outside this workflow)
      # Runs on re-runs too (no `if`). Lookup/parse/semver errors fail the job
      # before anything is published. semver comes from `npm ci` above (pinned
      # in package-lock.json).
      - name: Decide the npm dist-tag (monotonic channel)
        id: npm-tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CHANNEL: ${{ steps.release-type.outputs.tag }}
          PUBLISHED: ${{ steps.published.outputs.skip }}
        run: node .github/scripts/npm-publish-tag.js --package=@ai-support-agent/cli --version="$VERSION" --channel="$CHANNEL" --published="$PUBLISHED"

      # Never `--tag <channel>` directly: only the locked decision above may move
      # the channel. `:?` refuses an empty tag (npm would default to `latest`).
      # Auth: OIDC trusted publishing (id-token: write + setup-node registry-url).
      - name: Publish to npm
        if: steps.published.outputs.skip != 'true'
        env:
          PUBLISH_TAG: ${{ steps.npm-tag.outputs.publish_tag }}
        run: npm publish --access public --ignore-scripts --tag "${PUBLISH_TAG:?publish_tag was not decided}"
        timeout-minutes: 5

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: ${{ steps.release-type.outputs.prerelease }}
          body: |
            ## Changes
            See the [CHANGELOG](./CHANGELOG.md) for details.

            ## Installation
            ```bash
            npm install @ai-support-agent/cli@${{ steps.release-type.outputs.tag }}
            ```
          token: ${{ secrets.GITHUB_TOKEN }}

  # Makes a cancelled publish loud (see "Channel locks" above). The publish lock
  # keeps one running + ONE pending job, so a third queued tag of the same channel
  # cancels the pending one: that release is never published, its downstream jobs
  # are skipped, and the run would otherwise not count as failed.
  # `always()` (not `!cancelled()`): this job must run even though a job it needs
  # was cancelled, and how cancelled() evaluates when only a needed job (not the
  # run) was cancelled is not something to rely on; missing this report is worse
  # than a redundant one. Consequence: when a user cancels the whole run while
  # publish is in progress or queued, this job also runs and prints the same
  # error; that is acceptable (the run is cancelled anyway and the advice to
  # re-run still holds). A publish that hit its timeout-minutes may also end as
  # "cancelled" and is reported the same way.
  report_publish_cancelled:
    name: Report cancelled publish
    needs: publish
    if: always() && startsWith(github.ref, 'refs/tags/') && needs.publish.result == 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail the run because publish was cancelled
        env:
          TAG: ${{ github.ref_name }}
        run: |
          echo "::error::publish for ${TAG} was cancelled, so ${TAG} was NOT published (no npm version, GitHub Release, image or API notification). Most likely it was superseded while waiting for the release-channel lock (a newer tag of the same channel queued behind it), or the run was cancelled or timed out."
          echo "::error::Re-run this run for ${TAG} with \"Re-run all jobs\". That is safe: publish skips a version already published from this commit (gitHead check) and the channel dist-tag only moves forward (an older release never takes the channel)."
          exit 1

  # Tells the API the current version per channel. Deliberately a separate job:
  # in v0.5.15-beta.0 this request (then the last step of `publish`) got HTTP 403
  # from the API's CloudFront geo restriction because the GitHub-hosted runner's
  # egress IP was geolocated outside the allowed countries. That failed `publish`
  # after npm and the GitHub Release had already been published, so the image
  # jobs were skipped and a re-run could not get past `npm publish`.
  # As its own job, a notify failure no longer blocks the image jobs (they do not
  # need this job), and "Re-run failed jobs" re-runs only this job, on a fresh
  # runner (and usually a different egress IP).
  #
  # Channel lock + reconciliation (see "Channel locks" above; same design as
  # move_channel_tag): runs of different tags are not serialized by the workflow
  # group; an older tag's re-run could check the channel, a newer release could
  # then notify, and the older run's notification would land last. So:
  #   - job-level concurrency per channel serializes check->send across all runs;
  #   - the value sent is NOT this run's version but the version npm's dist-tag
  #     currently names (H >= this version, re-resolved before every attempt by
  #     notify-version.js), i.e. idempotent convergence to npm's truth.
  # A concurrency group keeps one running + one pending job and a newly queued
  # job CANCELS the pending one (cancel-in-progress: false only protects the
  # running one). That is harmless here: every job sends npm's current holder,
  # so the job that runs last sends the right value, and the newest release's own
  # job always runs after its dist-tag exists (it waits for propagation).
  # Residual: if the job holding the lock fails, the API keeps its previous value
  # until the next run in this group (or a re-run of the failed job).
  notify_version:
    name: Notify API of new version
    needs: publish
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    # The resolution may wait up to ~5 min for the dist-tag to propagate, plus up
    # to 3 requests of 30s and 40s of backoff.
    timeout-minutes: 15
    permissions:
      contents: read
    concurrency:
      group: release-channel-notify-${{ needs.publish.outputs.channel_tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # notify-version.js resolves the target (npm-channel-target.js) before each
      # attempt and PUTs it to /api/agent/version, retrying connection errors,
      # 5xx, 429 and 403 (geo/WAF) and failing fast on other 4xx.
      # semver: installed at the exact version pinned in package-lock.json, alone
      # (no full `npm ci`), into a temp prefix outside the checkout and exposed via
      # NODE_PATH, so the comparison is deterministic and no project deps or
      # install scripts run in this job.
      - name: Notify API of the channel's current version
        env:
          VERSION_API_URL: ${{ secrets.AGENT_VERSION_API_URL }}
          VERSION_API_KEY: ${{ secrets.AGENT_VERSION_API_KEY }}
          VERSION: ${{ needs.publish.outputs.version }}
          CHANNEL: ${{ needs.publish.outputs.channel_tag }}
          NODE_PATH: ${{ runner.temp }}/channel-check/node_modules
        run: |
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund --prefix "$RUNNER_TEMP/channel-check" semver@7.7.4
          node .github/scripts/notify-version.js --package=@ai-support-agent/cli --version="$VERSION" --channel="$CHANNEL"

  # ---------------------------------------------------------------------------
  # Container image (ghcr.io/mbc-net/ai-support-agent-cli)
  #
  # This is the image `manifest-generator.ts` (DEFAULT_AGENT_IMAGE) tells users to
  # run, so it must exist for a generated Deployment to start at all.
  #
  # `needs: publish` is REQUIRED, not cosmetic: docker/Dockerfile installs the CLI
  # with `npm install -g @ai-support-agent/cli@${AGENT_VERSION}`, so the version
  # has to be on the npm registry before the image can be built.
  #
  # The image jobs must NOT need `notify_version`: a failed API notification
  # (e.g. a CloudFront geo block) must not keep the image from being published.
  #
  # Built per-architecture on native runners and joined into one manifest list.
  # The Dockerfile compiles neovim from source and installs a rust toolchain, so
  # emulating arm64 under QEMU in a single job is far too slow.
  # ---------------------------------------------------------------------------
  publish_image:
    name: Publish Image (${{ matrix.platform }})
    needs: publish
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Wait for the version to be resolvable on npm
        # npm publish returning 200 does not mean the version is already served by
        # every registry replica. Building immediately can fail with E404 on a
        # version that was just published.
        run: |
          for i in $(seq 1 30); do
            if npm view "@ai-support-agent/cli@${{ needs.publish.outputs.version }}" version >/dev/null 2>&1; then
              echo "available after ${i} attempt(s)"
              exit 0
            fi
            sleep 10
          done
          echo "::error::@ai-support-agent/cli@${{ needs.publish.outputs.version }} did not become available on npm"
          exit 1

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            AGENT_VERSION=${{ needs.publish.outputs.version }}
          provenance: false
          outputs: type=image,name=ghcr.io/mbc-net/ai-support-agent-cli,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Save digest for the merge job
        run: |
          mkdir -p /tmp/digests
          echo "${{ steps.build.outputs.digest }}" > "/tmp/digests/${{ matrix.arch }}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/${{ matrix.arch }}
          retention-days: 1

  # Joins the per-architecture images into a single multi-arch manifest list and
  # publishes the immutable version tag only. The moving channel tag
  # (latest/beta/alpha) is move_channel_tag's job.
  publish_image_manifest:
    name: Publish Image Manifest
    # `publish` is listed so its outputs (version) are reachable;
    # `publish_image` is the actual build dependency.
    needs: [publish, publish_image]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: /tmp/digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Immutable version tag: always published (also on a re-run of an old tag).
      - name: Create manifest list and push version tag
        env:
          IMAGE: ghcr.io/mbc-net/ai-support-agent-cli
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          sources=()
          for f in /tmp/digests/*; do
            sources+=("${IMAGE}@$(cat "$f")")
          done
          if [ ${#sources[@]} -eq 0 ]; then
            echo "::error::no per-architecture digests were produced"
            exit 1
          fi
          docker buildx imagetools create --tag "${IMAGE}:${VERSION}" "${sources[@]}"

      - name: Show published image
        env:
          IMAGE: ghcr.io/mbc-net/ai-support-agent-cli
          VERSION: ${{ needs.publish.outputs.version }}
        run: docker buildx imagetools inspect "${IMAGE}:${VERSION}"

  # Points the moving channel tag (latest / beta / alpha, matching the npm
  # dist-tag chosen by the publish job, so `latest` only moves on a production
  # release) at the image of the version npm's dist-tag currently names.
  #
  # Channel lock + reconciliation (see "Channel locks" above): the workflow-level
  # concurrency group is per ref, so runs of DIFFERENT tags are not serialized.
  # An older tag's re-run could
  # check "the channel is still mine", a newer release could then move npm and
  # `:latest`, and the older run's tag update would land last and roll `:latest`
  # back (default k8s manifests pull `:latest` with imagePullPolicy Always ->
  # downgrade on restart). So:
  #   - job-level concurrency per channel serializes resolve->move across runs;
  #   - the tag is pointed at ${IMAGE}:<H>, H = npm's current dist-tag holder
  #     (>= this run's version; waits for propagation after a fresh publish), never
  #     at "this run's version": idempotent convergence to npm's truth.
  # A concurrency group keeps one running + one pending job and a newly queued
  # job CANCELS the pending one (cancel-in-progress: false only protects the
  # running one). That is harmless: every job reconciles to npm's current holder,
  # so the job that runs last in the group sets the right value, and the newest
  # release's own job always runs after its version tag exists (it needs
  # publish_image_manifest). If H's image is not published yet (H's release is
  # still building), this job leaves the tag alone and H's own run reconciles it.
  # Residual: if the job holding the lock fails, the channel tag keeps its
  # previous value until the next run in this group (or a re-run of the failed job).
  move_channel_tag:
    name: Move image channel tag
    needs: [publish, publish_image_manifest]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    # The resolution may wait up to ~5 min for the dist-tag to propagate.
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    concurrency:
      group: release-channel-image-${{ needs.publish.outputs.channel_tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Resolves H (see npm-channel-target.js): npm dist-tags[CHANNEL] once it is
      # >= VERSION. Fails (rather than guessing) on lookup errors or when the
      # dist-tag has not caught up after ~5 min.
      # semver: installed at the exact version pinned in package-lock.json, alone
      # (no full `npm ci`), into a temp prefix outside the checkout and exposed via
      # NODE_PATH, so the comparison is deterministic and no project deps or
      # install scripts run in this job.
      - name: Resolve the channel's target version from npm
        id: target
        env:
          VERSION: ${{ needs.publish.outputs.version }}
          CHANNEL: ${{ needs.publish.outputs.channel_tag }}
          NODE_PATH: ${{ runner.temp }}/channel-check/node_modules
        run: |
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund --prefix "$RUNNER_TEMP/channel-check" semver@7.7.4
          node .github/scripts/npm-channel-target.js --package=@ai-support-agent/cli --version="$VERSION" --channel="$CHANNEL"

      # Copies the target's version tag (an already published multi-arch manifest
      # list) to the channel tag. Only "not found" (buildx prints
      # "ERROR: <ref>: not found") means "H's image is not published yet"; any
      # other inspect error (auth, network, registry) fails the job.
      - name: Point the channel tag at the target's image
        env:
          IMAGE: ghcr.io/mbc-net/ai-support-agent-cli
          CHANNEL_TAG: ${{ needs.publish.outputs.channel_tag }}
          TARGET: ${{ steps.target.outputs.target }}
        run: |
          if ! inspect_out=$(docker buildx imagetools inspect "${IMAGE}:${TARGET}" 2>&1); then
            if grep -qF "${IMAGE}:${TARGET}: not found" <<<"$inspect_out"; then
              echo "::notice::${IMAGE}:${TARGET} is not published yet (its release is still building); left ${IMAGE}:${CHANNEL_TAG} unchanged. That release's own run will move it."
              exit 0
            fi
            echo "$inspect_out"
            echo "::error::could not inspect ${IMAGE}:${TARGET}"
            exit 1
          fi
          docker buildx imagetools create --tag "${IMAGE}:${CHANNEL_TAG}" "${IMAGE}:${TARGET}"
          docker buildx imagetools inspect "${IMAGE}:${CHANNEL_TAG}"
