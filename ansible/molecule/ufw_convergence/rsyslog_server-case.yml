---
# One verify case for rsyslog_server's ufw convergence (port 5514, tcp + udp).
# Same contract as zabbix_agent-case.yml.
- name: "verify({{ ufwc_case.id }}) : Snapshot the ufw rules before the run"
  ansible.builtin.command:
    argv: [ufw, show, added]
  register: ufwc_before
  changed_when: false

- name: "verify({{ ufwc_case.id }}) : Reset the run outcome"
  ansible.builtin.set_fact:
    ufwc_run_failed: false
    ufwc_failed_task_name: ""
    ufwc_failed_task_action: ""

- name: "verify({{ ufwc_case.id }}) : Run the rsyslog_server ufw convergence"
  when: ufwc_case.run | default(true)
  block:
    - name: "verify({{ ufwc_case.id }}) : Include rsyslog_server tasks_from ufw"
      ansible.builtin.include_role:
        name: rsyslog_server
        tasks_from: ufw
      vars:
        rsyslog_server_port: 5514
        rsyslog_server_tcp_enabled: true
        rsyslog_server_udp_enabled: true
        rsyslog_server_allow_all_senders: false
        rsyslog_server_allowed_senders: "{{ ufwc_case.sources }}"
  rescue:
    - name: "verify({{ ufwc_case.id }}) : Record that the run failed and where"
      ansible.builtin.set_fact:
        ufwc_run_failed: true
        ufwc_failed_task_name: "{{ ansible_failed_task.name | default('') }}"
        ufwc_failed_task_action: "{{ ansible_failed_task.action | default('') }}"

- name: "verify({{ ufwc_case.id }}) : Judge the case"
  ansible.builtin.include_tasks: check-case.yml
  vars:
    ufwc_role: rsyslog_server
