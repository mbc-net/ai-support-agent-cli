---
# Converge each role's ufw convergence with a `/32` source mixed with a plain
# CIDR. The `/32` entry is the one ufw rewrites when it stores the rule (it is
# listed without the suffix), so a role that compares against the input string
# deletes its own rule again — and the `idempotence` step then sees the second
# converge add and delete it once more.
#
# The values are restated in verify.yml (cases `*-converged`), which checks the
# rules actually present after this play.
- name: Converge
  hosts: all
  become: true
  gather_facts: false

  tasks:
    - name: "Converge : zabbix_agent ufw convergence (/32 + CIDR)"
      ansible.builtin.include_role:
        name: zabbix_agent
        tasks_from: ufw
      vars:
        zabbix_agent_listen_port: 10050
        zabbix_agent_allowed_sources:
          - 192.168.0.20/32
          - 10.0.0.0/24

    - name: "Converge : rsyslog_server ufw convergence (/32 + CIDR, tcp + udp)"
      ansible.builtin.include_role:
        name: rsyslog_server
        tasks_from: ufw
      vars:
        rsyslog_server_port: 5514
        rsyslog_server_tcp_enabled: true
        rsyslog_server_udp_enabled: true
        rsyslog_server_allow_all_senders: false
        rsyslog_server_allowed_senders:
          - 192.168.0.30/32
          - 10.0.1.0/24

    - name: "Converge : zabbix_server ufw convergence (/32 + CIDR)"
      ansible.builtin.include_role:
        name: zabbix_server
        tasks_from: ufw
      vars:
        zabbix_server_listen_port: 10051
        zabbix_server_allowed_sources:
          - 192.168.0.40/32
          - 10.0.2.0/24

    - name: "Converge : zabbix_web ufw convergence (/32 + CIDR)"
      ansible.builtin.include_role:
        name: zabbix_web
        tasks_from: ufw
      vars:
        zabbix_web_listen_port: 8080
        zabbix_web_allowed_sources:
          - 192.168.0.50/32
          - 10.0.3.0/24
