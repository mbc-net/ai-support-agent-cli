---
# One verify case for zabbix_agent's ufw convergence.
#
# Input: `ufwc_case` (see verify.yml for the fields). The role is run in a
# block so that a rejection can be recorded instead of aborting the play;
# check-case.yml then judges the run and the real `ufw show added` output.
- name: "verify({{ ufwc_case.id }}) : Snapshot the ufw rules before the run"
  ansible.builtin.command:
    argv: [ufw, show, added]
  register: ufwc_before
  changed_when: false

- name: "verify({{ ufwc_case.id }}) : Reset the run outcome"
  ansible.builtin.set_fact:
    ufwc_run_failed: false
    ufwc_failed_task_name: ""
    ufwc_failed_task_action: ""

- name: "verify({{ ufwc_case.id }}) : Run the zabbix_agent ufw convergence"
  when: ufwc_case.run | default(true)
  block:
    - name: "verify({{ ufwc_case.id }}) : Include zabbix_agent tasks_from ufw"
      ansible.builtin.include_role:
        name: zabbix_agent
        tasks_from: ufw
      vars:
        zabbix_agent_listen_port: 10050
        zabbix_agent_allowed_sources: "{{ ufwc_case.sources }}"
  rescue:
    - name: "verify({{ ufwc_case.id }}) : Record that the run failed and where"
      ansible.builtin.set_fact:
        ufwc_run_failed: true
        ufwc_failed_task_name: "{{ ansible_failed_task.name | default('') }}"
        ufwc_failed_task_action: "{{ ansible_failed_task.action | default('') }}"

- name: "verify({{ ufwc_case.id }}) : Judge the case"
  ansible.builtin.include_tasks: check-case.yml
  vars:
    ufwc_role: zabbix_agent
