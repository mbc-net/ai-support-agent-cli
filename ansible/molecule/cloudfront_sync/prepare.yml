---
- name: Prepare a disposable CloudFront synchronization test host
  hosts: all
  become: true
  tasks:
    # iptables also provides iptables-legacy-save/ip6tables-legacy-save,
    # whose rulesets the S0 verifier compares.
    - name: Install real system services and firewall tools
      ansible.builtin.apt:
        name: [python3, ufw, nginx, iproute2, openssh-server, ca-certificates, nftables, iptables]
        state: present
        update_cache: true

    - name: Mark this isolated host as disposable
      ansible.builtin.copy:
        content: "CloudFront sync isolated verification only\n"
        dest: /run/cloudfront-sync-disposable-test
        owner: root
        group: root
        mode: "0600"

    - name: Create sshd runtime directory
      ansible.builtin.file:
        path: /run/sshd
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Keep SSH allowed before enabling the firewall
      ansible.builtin.command:
        argv: [ufw, allow, 22/tcp]
      changed_when: false

    - name: Enable the real UFW firewall in the isolated host
      ansible.builtin.command:
        argv: [ufw, --force, enable]
      changed_when: false

    # nginx must be active for the verifier's S1 nginx phase, which stages,
    # reloads, stops and restarts it and restores the original configuration;
    # the container's systemd also provides the systemd-run sandbox that
    # inspect-runtime uses for nginx -T.
    - name: Start nginx and sshd
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: started
      loop: [nginx, ssh]
