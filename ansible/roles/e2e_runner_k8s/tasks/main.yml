---
# e2e_runner_k8s : E2E(Playwright)ジョブをオンデマンドで投入できるように、
# Kubernetes クラスタへ専用 namespace・RBAC・低権限 kubeconfig を用意する。
#
# 実行場所: kubectl と kubeconfig を持つノード（k3s サーバーノード等）。
#
# 何を作るロールで、何を作らないか:
#   このロールは「E2E Job を都度投入できる状態」を用意するだけで、Job 自体は
#   作らない（Job の create/delete は毎回発生する運用操作であり、他の bundled role
#   と同様レシピが表す「クラスタの恒常的な構成」には当たらない）。ここで用意した
#   ServiceAccount・Role・RoleBinding・専用 kubeconfig を使って、クラスタ管理者
#   kubeconfig を経由せずに Job を投入できるようにすることが目的。
#
# 最小権限:
#   ServiceAccount `e2e_runner_k8s_service_account_name` に付与する Role は
#   `e2e_runner_k8s_namespace` 名前空間限定（ClusterRole ではない）で、
#   jobs は get・list・watch・create・delete、pods は get・list・watch・delete
#   （create は許可しない。Pod は Job コントローラが作る）、pods/log は get のみを
#   許可する。Kubernetes API の権限としては ai-support-agent 等の他の namespace の
#   オブジェクトを読み書きできない。
#
# ネットワーク分離（API 権限とは別の話）:
#   namespace に NetworkPolicy を置き、**受信だけ**を既定拒否する（podSelector: {}・
#   policyTypes: [Ingress]・ingress 規則なし）。他 namespace の Pod から E2E Job の
#   Pod へは到達できない。一方、**送信は制限しない**: E2E はテスト対象アプリの URL と
#   git ホストへ到達する必要があるため、Job の Pod からクラスタ内の他 namespace の
#   Service を含む任意の宛先へ接続できる。k3s は組み込みの network policy
#   コントローラ（kube-router 由来）で NetworkPolicy を強制する（`--disable-network-policy`
#   で起動したクラスタでは強制されない）。
#
# 資源の既定値:
#   ResourceQuota が requests/limits の cpu・memory を縛るため、resources を書かない
#   Pod は admission で拒否され、Job は FailedCreate になる（submitter は events を
#   読めないので原因にも辿り着けない）。同じ namespace に LimitRange を置き、Container
#   単位の既定 requests/limits を与える（値はタスク内のリテラル。理由は該当タスク参照）。
#
# 設計上の残余リスク（受け入れ済み・運用で抑える）:
#   (1) git デプロイトークンは kubeconfig 保持者が読み出せる。jobs create + pods/log
#       get があれば、同じ namespace の Secret（`<namespace>-git-deploy-token`）を
#       マウント／環境変数にした Job を作り、値を出力させてログで読めるため。E2E Job
#       自身が clone にこの Secret を使う以上、RBAC では塞げない。PAT は対象リポジトリ
#       限定・読み取り専用（GitLab なら read_repository、GitHub なら Fine-grained の
#       Contents: Read-only）の最小スコープで発行すること。
#   (2) ServiceAccount トークンは無期限で、回転の仕組みを持たない。トークン Secret
#       （type: kubernetes.io/service-account-token）はロール再実行時も既存のものを
#       再利用する。回転するには、管理者 kubeconfig で
#       `kubectl -n <namespace> delete secret <service_account_name>-token` を実行して
#       旧トークンを失効させ、このロールを再実行する（Secret の再作成で新トークンが
#       発行され、kubeconfig も新トークンで書き直される）。旧 kubeconfig の配布先が
#       あれば差し替えること。
#
# 秘匿値の扱い（2方向）:
#   (a) クラスタへ**入れる**秘匿値（git デプロイトークン）: (a)-1 Ansible の
#       `environment:` キーワード、(a)-2 shell/command 本文への Jinja 展開、
#       (a)-3 生成マニフェスト、のいずれにも載せない。0600 の一時ファイルへ `copy` の
#       `content` で書き（モジュール自身が値を秘匿する）、
#       `kubectl create secret --from-file=` で読ませてから必ず削除する
#       （roles/github_runner_k8s と同じ方針）。
#   (b) クラスタから**取り出す**秘匿値（発行された ServiceAccount トークン）:
#       Ansible の register/set_fact には一切載せない。token の取得・base64 decode・
#       kubeconfig への埋め込みまでを 1 つの remote shell 実行内で完結させ、値は
#       シェル変数としてのみ存在し、Ansible の実行結果 JSON（-vvv 含む）に出ない。
#       完了を待つ retry では文字数のみを確認し、値そのものは登録しない。
#
# 既知の制約:
#   ServiceAccount トークン Secret（type: kubernetes.io/service-account-token）は
#   コントローラが非同期に `.data.token` を populate するため、作成直後は空になり
#   うる。populate 完了を待たずに読むと空文字列を埋め込んだ壊れた kubeconfig ができる
#   ため、文字数が 0 より大きくなるまで待ってから読む。

- name: "e2e_runner_k8s : Validate the git deploy token is set"
  # 値そのものは that / fail_msg に展開しない（assert に no_log を付けると案内ごと
  # 隠れるため、隠すのではなく「値を出さない書き方」で対処する）。
  ansible.builtin.assert:
    that:
      - e2e_runner_k8s_git_deploy_token | default('') | trim | length > 0
    fail_msg: >-
      e2e_runner_k8s_git_deploy_token is required. Reference an ANSIBLE# secret
      variable from the recipe, e.g. e2e_runner_k8s_git_deploy_token:
      "{{ '{{ MY_E2E_DEPLOY_TOKEN }}' }}". A fine-grained, read-only,
      repository-scoped GitHub PAT is recommended.
    success_msg: "Git deploy token is set."

- name: "e2e_runner_k8s : Validate Kubernetes object names are DNS-1123 labels"
  # 名前は metadata.name・ServiceAccount 参照・RoleBinding 参照・Secret 参照など
  # 複数の構造的位置へ展開され、かつ shell 本文にも入る。クォートでは救えないため
  # 先に落とす。git_secret_name / sa_token_secret_name は派生値だが、shell へ展開
  # する以上ここで検証する（github_runner_k8s と同じ理由）。
  ansible.builtin.assert:
    that:
      - e2e_runner_k8s_namespace is match('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$')
      - e2e_runner_k8s_namespace | length <= 63
      - e2e_runner_k8s_service_account_name is match('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$')
      - e2e_runner_k8s_service_account_name | length <= 63
      - e2e_runner_k8s_role_name is match('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$')
      - e2e_runner_k8s_role_name | length <= 63
      - e2e_runner_k8s_role_binding_name is match('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$')
      - e2e_runner_k8s_role_binding_name | length <= 63
      - e2e_runner_k8s_git_secret_name is match('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$')
      - e2e_runner_k8s_git_secret_name | length <= 63
      - e2e_runner_k8s_sa_token_secret_name is match('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$')
      - e2e_runner_k8s_sa_token_secret_name | length <= 63
    fail_msg: >-
      e2e_runner_k8s_namespace / _service_account_name / _role_name /
      _role_binding_name / (derived) _git_secret_name / _sa_token_secret_name
      must be lowercase DNS-1123 labels (alphanumerics and "-", starting and
      ending with an alphanumeric, max 63 chars). Got
      namespace={{ e2e_runner_k8s_namespace }},
      service_account={{ e2e_runner_k8s_service_account_name }},
      role={{ e2e_runner_k8s_role_name }},
      role_binding={{ e2e_runner_k8s_role_binding_name }},
      git_secret_name={{ e2e_runner_k8s_git_secret_name }},
      sa_token_secret_name={{ e2e_runner_k8s_sa_token_secret_name }}.
    success_msg: "Kubernetes object names are valid."

- name: "e2e_runner_k8s : Validate the namespace uses the e2e prefix"
  # DNS-1123 形式であることは前段で検証済みだが、それだけでは recipe が
  # `kube-system` や `ai-support-agent`（本番寄り StatefulSet 群が稼働中）のような
  # 既存の重要 namespace を指定できてしまう。この場合、このロールが作る Role/
  # RoleBinding がその namespace 内で jobs/pods（delete 含む）への権限を持つ
  # ServiceAccount を作ってしまい、他ワークロードへの誤操作経路になる。
  # denylist（将来追加される namespace を見落とす）ではなく、このロール専用の
  # 名前空間だけを許すインラインリテラルの allowlist パターンにする
  # （CLAUDE.md「フォールバック禁止ルール」、ai_support_agent_k8s の image allowlist
  # と同じ方針）。
  ansible.builtin.assert:
    that:
      - e2e_runner_k8s_namespace is match('^e2e(-[a-z0-9]+)*$')
    fail_msg: >-
      e2e_runner_k8s_namespace must be "e2e" or "e2e-<suffix>" (lowercase
      alphanumerics, hyphen-separated). This role must not be pointed at an
      existing namespace (e.g. kube-system, ai-support-agent) — doing so would
      grant its ServiceAccount job/pod delete access there. Got:
      {{ e2e_runner_k8s_namespace }}.
    success_msg: "Namespace uses the e2e prefix."

- name: "e2e_runner_k8s : Validate the ResourceQuota values are Kubernetes quantities"
  ansible.builtin.assert:
    that:
      - e2e_runner_k8s_quota_cpu_requests is match('^[0-9]+(\.[0-9]+)?(E|P|T|G|M|k|Ei|Pi|Ti|Gi|Mi|Ki|m)?$')
      - e2e_runner_k8s_quota_memory_requests is match('^[0-9]+(\.[0-9]+)?(E|P|T|G|M|k|Ei|Pi|Ti|Gi|Mi|Ki)?$')
      - e2e_runner_k8s_quota_cpu_limits is match('^[0-9]+(\.[0-9]+)?(E|P|T|G|M|k|Ei|Pi|Ti|Gi|Mi|Ki|m)?$')
      - e2e_runner_k8s_quota_memory_limits is match('^[0-9]+(\.[0-9]+)?(E|P|T|G|M|k|Ei|Pi|Ti|Gi|Mi|Ki)?$')
      - e2e_runner_k8s_quota_pods is match('^[0-9]+$')
    fail_msg: >-
      e2e_runner_k8s_quota_* must be valid Kubernetes quantities (e.g. "8",
      "16Gi"), and quota_pods must be a plain non-negative integer. Got
      cpu_requests={{ e2e_runner_k8s_quota_cpu_requests }},
      memory_requests={{ e2e_runner_k8s_quota_memory_requests }},
      cpu_limits={{ e2e_runner_k8s_quota_cpu_limits }},
      memory_limits={{ e2e_runner_k8s_quota_memory_limits }},
      pods={{ e2e_runner_k8s_quota_pods }}.
    success_msg: "ResourceQuota values are valid."

- name: "e2e_runner_k8s : Validate cluster access paths"
  # ここで検証した値のみを shell 本文へ展開してよい（ファイル冒頭コメント参照）。
  #
  # 各パスセグメントの先頭にドットを許さない（(?!\.)）＋ '..' を含まないことも別途
  # 確認する。文字集合と絶対パス性だけでは `/etc/rancher/k3s/./k3s.yaml` のような
  # 別綴りの同一ファイルを弾けず、下の「output kubeconfig と管理者 kubeconfig の
  # 分離」assert が文字列比較のまま素通りしてしまう（commit 342192a
  # "close the dot-segment path bypass" と同じ理由・同じパターン）。
  ansible.builtin.assert:
    that:
      - e2e_runner_k8s_kubectl is match('^/(?!\.)[A-Za-z0-9._-]+(/(?!\.)[A-Za-z0-9._-]+)*$')
      - "'..' not in e2e_runner_k8s_kubectl"
      - e2e_runner_k8s_kubeconfig is match('^/(?!\.)[A-Za-z0-9._-]+(/(?!\.)[A-Za-z0-9._-]+)*$')
      - "'..' not in e2e_runner_k8s_kubeconfig"
      - e2e_runner_k8s_manifest_dir is match('^/(?!\.)[A-Za-z0-9._-]+(/(?!\.)[A-Za-z0-9._-]+)*$')
      - "'..' not in e2e_runner_k8s_manifest_dir"
      - e2e_runner_k8s_output_kubeconfig_path is match('^/(?!\.)[A-Za-z0-9._-]+(/(?!\.)[A-Za-z0-9._-]+)*$')
      - "'..' not in e2e_runner_k8s_output_kubeconfig_path"
    fail_msg: >-
      e2e_runner_k8s_kubectl / _kubeconfig / _manifest_dir /
      _output_kubeconfig_path must be absolute paths made of alphanumerics and
      ._- per segment (no segment may start with "." and no ".." segment is
      allowed).
    success_msg: "Cluster access paths are valid."

- name: "e2e_runner_k8s : Validate the output kubeconfig path is confined to a fixed safe directory"
  # output_kubeconfig_path は recipe の task-level vars から上書き可能（テナント
  # 入力を敵対的として扱う前提）。文字集合・dot-segment 検証だけでは
  # `/etc/cron.d/x` のような既存の重要パスを指せてしまい、後段の
  # 「Ensure the output kubeconfig directory exists」タスクがそのパスを
  # `mbc:mbc` へ chown してしまう。owner/group 自体は本ロール専有の固定リテラル
  # `mbc` にして recipe から変更不能にしたが、path は環境ごとに変える正当な理由が
  # ありうるため変数のまま残し、代わりにこのロール専用のディレクトリ配下にのみ
  # 限定する。
  ansible.builtin.assert:
    that:
      - e2e_runner_k8s_output_kubeconfig_path is match('^/etc/e2e-runner/(?!\.)[A-Za-z0-9._-]+$')
    fail_msg: >-
      e2e_runner_k8s_output_kubeconfig_path must be a direct child of
      /etc/e2e-runner/ (e.g. /etc/e2e-runner/kubeconfig). Got:
      {{ e2e_runner_k8s_output_kubeconfig_path }}.
    success_msg: "Output kubeconfig path is confined to a fixed safe directory."

- name: "e2e_runner_k8s : Validate the output kubeconfig is not the cluster admin kubeconfig"
  # ファイル冒頭「何を作るロールで、何を作らないか」で謳っている「専用 kubeconfig は
  # 管理者 kubeconfig と別ファイル」という設計不変条件を、recipe の task-level vars に
  # よる上書きに対しても runtime で保証する。一致したまま進むと、後段の
  # "Generate the scoped kubeconfig" タスクが管理者 kubeconfig 自体に低権限
  # ServiceAccount の user/context をマージし、current-context まで書き換えてしまう。
  ansible.builtin.assert:
    that:
      - e2e_runner_k8s_output_kubeconfig_path != e2e_runner_k8s_kubeconfig
    fail_msg: >-
      e2e_runner_k8s_output_kubeconfig_path must not equal
      e2e_runner_k8s_kubeconfig. Writing the scoped ServiceAccount kubeconfig
      to the cluster admin kubeconfig path would merge a low-privilege
      user/context into it and switch its current-context. Got
      output_kubeconfig_path={{ e2e_runner_k8s_output_kubeconfig_path }},
      kubeconfig={{ e2e_runner_k8s_kubeconfig }}.
    success_msg: "Output kubeconfig is separate from the cluster admin kubeconfig."

- name: "e2e_runner_k8s : Validate the manifest directory is confined to a fixed safe directory"
  # e2e_runner_k8s_manifest_dir も recipe の task-level vars から上書き可能。
  # 文字集合・dot-segment 検証だけでは `/etc` や `/etc/rancher/k3s` のような既存の
  # 重要ディレクトリを指せてしまい、直後の「Ensure the manifest directory exists」
  # タスクがそのディレクトリを root:root 0700 に変更してしまう
  # （output_kubeconfig_path と同じ理由・同じパターン）。
  ansible.builtin.assert:
    that:
      - e2e_runner_k8s_manifest_dir is match('^/etc/e2e-runner/(?!\.)[A-Za-z0-9._-]+$')
    fail_msg: >-
      e2e_runner_k8s_manifest_dir must be a direct child of /etc/e2e-runner/
      (e.g. /etc/e2e-runner/k8s). Got: {{ e2e_runner_k8s_manifest_dir }}.
    success_msg: "Manifest directory is confined to a fixed safe directory."

- name: "e2e_runner_k8s : Validate the output kubeconfig path does not collide with the manifest directory"
  # 両方とも独立した recipe 変数で、同じ `/etc/e2e-runner/<1階層>` という形状を持つ
  # ため同じ値を設定できてしまう。衝突すると「Ensure the manifest directory
  # exists」が実在ディレクトリを作った後、「Generate the scoped kubeconfig」の
  # `mv -f -T <tmp> <path>` がディレクトリを上書きできず `cannot overwrite directory`
  # という生のシェルエラーで落ちる。output_kubeconfig_path != kubeconfig の assert と
  # 同じ丁寧さで、原因を名指しして早期に落とす。
  ansible.builtin.assert:
    that:
      - e2e_runner_k8s_output_kubeconfig_path != e2e_runner_k8s_manifest_dir
    fail_msg: >-
      e2e_runner_k8s_output_kubeconfig_path must not equal
      e2e_runner_k8s_manifest_dir. Writing the kubeconfig to the manifest
      directory's path would crash "Generate the scoped kubeconfig" with a
      raw "cannot overwrite directory" shell error. Got
      output_kubeconfig_path={{ e2e_runner_k8s_output_kubeconfig_path }},
      manifest_dir={{ e2e_runner_k8s_manifest_dir }}.
    success_msg: "Output kubeconfig path does not collide with the manifest directory."

- name: "e2e_runner_k8s : Validate the ServiceAccount token wait settings are bounded integers"
  # 非数値・負数を渡すと Jinja の `int` フィルタが 0 にフォールバックしたり（retries
  # が実質1回に潰れる）、Python の time.sleep() が負数で ValueError を出したりする
  # （rsyslog_forward / zabbix_agent の *_verify_seconds 系と同じ検証パターン）。
  # 上限も設けるのは、`999999999` のような値で Ansible 実行を長時間占有させたり
  # `0` で待機を実質無効化させたりする経路を塞ぐため。
  ansible.builtin.assert:
    that:
      - e2e_runner_k8s_token_secret_retries is match('^[0-9]+$')
      - e2e_runner_k8s_token_secret_retries | int >= 1
      - e2e_runner_k8s_token_secret_retries | int <= 30
      - e2e_runner_k8s_token_secret_delay_seconds is match('^[0-9]+$')
      - e2e_runner_k8s_token_secret_delay_seconds | int >= 1
      - e2e_runner_k8s_token_secret_delay_seconds | int <= 30
    fail_msg: >-
      e2e_runner_k8s_token_secret_retries / _delay_seconds must be plain
      integers between 1 and 30 (inclusive). Got
      retries={{ e2e_runner_k8s_token_secret_retries }},
      delay_seconds={{ e2e_runner_k8s_token_secret_delay_seconds }}.
    success_msg: "ServiceAccount token wait settings are valid."

- name: "e2e_runner_k8s : Validate the cluster server URL"
  ansible.builtin.assert:
    that:
      - e2e_runner_k8s_cluster_server_url is match('^https://[A-Za-z0-9.-]+(:[0-9]+)?$')
    fail_msg: >-
      e2e_runner_k8s_cluster_server_url must be an https URL (host[:port] only,
      no path). Got: {{ e2e_runner_k8s_cluster_server_url }}.
    success_msg: "Cluster server URL is well-formed."

- name: "e2e_runner_k8s : Check the kubectl binary"
  ansible.builtin.stat:
    path: "{{ e2e_runner_k8s_kubectl }}"
  register: e2e_runner_k8s_kubectl_stat

- name: "e2e_runner_k8s : Assert kubectl is available"
  ansible.builtin.assert:
    that:
      - e2e_runner_k8s_kubectl_stat.stat.exists
      - e2e_runner_k8s_kubectl_stat.stat.executable | default(false)
    fail_msg: >-
      kubectl not found or not executable at {{ e2e_runner_k8s_kubectl }}. Run
      this role on a node that administers the cluster (a k3s server node), or
      set e2e_runner_k8s_kubectl to the correct path.
    success_msg: "kubectl is available."

- name: "e2e_runner_k8s : Check the kubeconfig"
  ansible.builtin.stat:
    path: "{{ e2e_runner_k8s_kubeconfig }}"
  register: e2e_runner_k8s_kubeconfig_stat

- name: "e2e_runner_k8s : Assert the kubeconfig is readable"
  ansible.builtin.assert:
    that:
      - e2e_runner_k8s_kubeconfig_stat.stat.exists
    fail_msg: >-
      kubeconfig not found at {{ e2e_runner_k8s_kubeconfig }}. Set
      e2e_runner_k8s_kubeconfig to the cluster's kubeconfig path (k3s default:
      /etc/rancher/k3s/k3s.yaml).
    success_msg: "kubeconfig is present."

- name: "e2e_runner_k8s : Check the cluster CA certificate"
  # パスはインラインリテラル（role 変数ではない）。recipe の task-level vars から
  # 差し替え可能にすると、任意の root 読み取り可能ファイルの中身を後段の
  # kubeconfig 生成タスクが埋め込んで持ち出す経路になる（defaults/main.yml 参照）。
  ansible.builtin.stat:
    path: /var/lib/rancher/k3s/server/tls/server-ca.crt
  register: e2e_runner_k8s_ca_stat

- name: "e2e_runner_k8s : Assert the cluster CA certificate is present"
  ansible.builtin.assert:
    that:
      - e2e_runner_k8s_ca_stat.stat.exists
    fail_msg: >-
      Cluster CA certificate not found at
      /var/lib/rancher/k3s/server/tls/server-ca.crt. This role only supports
      the standard k3s server CA path; it is not configurable.
    success_msg: "Cluster CA certificate is present."

- name: "e2e_runner_k8s : Validate the mbc account exists"
  # 出力 kubeconfig とそのディレクトリの owner/group はインラインリテラル `mbc`
  # （defaults/main.yml 参照）。アカウントが無いと、namespace・RBAC・トークンまで
  # 作り終えた後段の chown で初めて落ち、クラスタに半端な状態が残る。何か作る前に
  # 確かめ、getent の素の失敗文言ではなく原因を名指しして止める。
  # register は使わない（getent の結果は fact に入るだけで、ガードの内部変数一覧に
  # 載せる名前を増やさない）。
  block:
    - name: "e2e_runner_k8s : Look up the mbc account"
      ansible.builtin.getent:
        database: passwd
        key: mbc
    - name: "e2e_runner_k8s : Look up the mbc group"
      # group: mbc も使う（kubeconfig ディレクトリは root:mbc 0750）。
      ansible.builtin.getent:
        database: group
        key: mbc
  rescue:
    - name: "e2e_runner_k8s : Fail because the mbc account does not exist"
      ansible.builtin.fail:
        msg: >-
          The local user or group "mbc" was not found (getent passwd/group mbc
          failed). This role makes the scoped kubeconfig owned by mbc:mbc and
          its directory root:mbc; create the mbc user and group on this node
          first, then re-run. Nothing has been created in the cluster yet.

- name: "e2e_runner_k8s : Ensure the target namespace exists"
  # create --dry-run=client | apply は、存在しても失敗しない冪等な適用手順
  # （ai_support_agent_k8s / github_runner_k8s と同じ）。
  ansible.builtin.shell: >-
    set -o pipefail &&
    {{ e2e_runner_k8s_kubectl }} --kubeconfig={{ e2e_runner_k8s_kubeconfig }} --request-timeout=30s
    create namespace {{ e2e_runner_k8s_namespace }}
    --dry-run=client -o yaml
    | {{ e2e_runner_k8s_kubectl }} --kubeconfig={{ e2e_runner_k8s_kubeconfig }} --request-timeout=30s
    apply -f -
  args:
    executable: /bin/bash
  register: e2e_runner_k8s_namespace_apply
  changed_when: "'unchanged' not in e2e_runner_k8s_namespace_apply.stdout"

- name: "e2e_runner_k8s : Enforce the baseline Pod Security Standard on the namespace"
  # このロールが与える RBAC は jobs の create を許すため、Job 経由で任意の PodSpec
  # （privileged / hostPath / hostNetwork 等）を投入できてしまう余地がある。
  # `restricted` ではなく `baseline` にするのは、E2E ジョブ本体の実際の PodSpec
  # 要件（特権が要らないことの確認）が未確定なため。将来 PodSpec 要件が固まったら
  # `restricted` へ引き上げを検討する。
  ansible.builtin.command:
    argv:
      - "{{ e2e_runner_k8s_kubectl }}"
      - "--kubeconfig={{ e2e_runner_k8s_kubeconfig }}"
      - "--request-timeout=30s"
      - label
      - namespace
      - "{{ e2e_runner_k8s_namespace }}"
      - "pod-security.kubernetes.io/enforce=baseline"
      - --overwrite
  # `kubectl label --overwrite` は値が変わらないとき `namespace/<name> not labeled` を、
  # 変わったときだけ `namespace/<name> labeled` を出力する（kubectl の
  # updateDataChangeMsg）。これで変更の有無を判定する。
  # register は新設せず、直前の namespace apply の名前を流用する（ガードの内部変数一覧
  # BUNDLED_ROLE_INTERNAL_VARS を増やさないため。apply 側の結果はその changed_when
  # 評価後どこからも参照しないので、上書きしても影響しない）。
  register: e2e_runner_k8s_namespace_apply
  changed_when: "'not labeled' not in e2e_runner_k8s_namespace_apply.stdout"

- name: "e2e_runner_k8s : Check the output kubeconfig directory is not a pre-existing symlink"
  # ディレクトリを root:mbc 0750 にする対策は mbc による**新規**の symlink 設置は
  # 防ぐが、それ以前に別経路でこの path が symlink として存在していた場合までは
  # 防げない。`ansible.builtin.file` は既定で symlink を追いかけるため、事前に
  # lstat で検知し、黙って上書きせず止める（CLAUDE.md フォールバック禁止ルール）。
  #
  # manifest_dir と output_kubeconfig_path はどちらも /etc/e2e-runner の直下に限定
  # されている（前段の assert 参照）ので、この path は manifest_dir の親でもある。
  # 直後の「Ensure the manifest directory exists」は親を暗黙に辿って作るため、親が
  # symlink のままだとリンク先の配下にディレクトリを作ってしまう。だからマニフェスト
  # ディレクトリの作成より**前**に検査する（register は従来の名前を流用する）。
  ansible.builtin.stat:
    path: "{{ e2e_runner_k8s_output_kubeconfig_path | dirname }}"
    follow: false
  register: e2e_runner_k8s_output_dir_lstat

- name: "e2e_runner_k8s : Fail if the output kubeconfig directory path is a symlink"
  ansible.builtin.fail:
    msg: >-
      {{ e2e_runner_k8s_output_kubeconfig_path | dirname }} already exists as a
      symlink
      (target: {{ e2e_runner_k8s_output_dir_lstat.stat.lnk_target | default('unknown') }}).
      Refusing to follow it and change ownership/mode on whatever it points to.
      Remove the symlink manually and re-run this role.
  when: >-
    e2e_runner_k8s_output_dir_lstat.stat.exists | default(false)
    and e2e_runner_k8s_output_dir_lstat.stat.islnk | default(false)

- name: "e2e_runner_k8s : Check the manifest directory is not a pre-existing symlink"
  # `ansible.builtin.file` は既定で symlink を追いかけるため、この path が既に
  # （このロールの旧版実行時や他経路で）symlink として存在していると、直後の
  # 「Ensure the manifest directory exists」がリンク先を root:root 0700 に変更して
  # しまう。黙って削除・上書きするのではなく、運用者に気づかせて止める
  # （CLAUDE.md フォールバック禁止ルール）。
  ansible.builtin.stat:
    path: "{{ e2e_runner_k8s_manifest_dir }}"
    follow: false
  register: e2e_runner_k8s_manifest_dir_lstat

- name: "e2e_runner_k8s : Fail if the manifest directory path is a symlink"
  ansible.builtin.fail:
    msg: >-
      {{ e2e_runner_k8s_manifest_dir }} already exists as a symlink
      (target: {{ e2e_runner_k8s_manifest_dir_lstat.stat.lnk_target | default('unknown') }}).
      Refusing to follow it and change ownership/mode on whatever it points to.
      Remove the symlink manually and re-run this role.
  when: >-
    e2e_runner_k8s_manifest_dir_lstat.stat.exists | default(false)
    and e2e_runner_k8s_manifest_dir_lstat.stat.islnk | default(false)

- name: "e2e_runner_k8s : Ensure the manifest directory exists"
  ansible.builtin.file:
    path: "{{ e2e_runner_k8s_manifest_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: "e2e_runner_k8s : Write the namespace guardrails manifest (ResourceQuota / LimitRange / NetworkPolicy)"
  # 秘匿値は含まない。監査と再適用のためノード上へ残す。
  #
  # 3 つを 1 ファイル・1 回の apply にまとめるのは、どれも「namespace に掛ける恒常的な
  # 歯止め」で一緒に変わるものだから、かつ register 名（ガードの内部変数一覧
  # BUNDLED_ROLE_INTERNAL_VARS に載せる名前）を増やさないため。register 名が
  # `_quota_` のままなのは後者の理由（ResourceQuota だけを書いていた頃の名前）。
  #
  # LimitRange（type: Container の既定 requests/limits）:
  #   ResourceQuota が requests/limits の cpu・memory を縛る namespace では、resources を
  #   書かない Pod は admission で拒否され Job が FailedCreate になる。submitter は
  #   events を読めないので原因にも辿り着けない。既定値をここで与える。
  #   値はレシピ変数にせずリテラルで固定する（公開変数を増やすとガードの許可リストにも
  #   同じ追加が要り、既定値と quota の整合を recipe ごとに崩せるようになるため）。
  #   既定の ResourceQuota（requests 8 CPU / 16Gi・limits 16 CPU / 32Gi・pods 8）に対し、
  #   既定値どおりの Pod を pods 上限の 8 個並べても requests 4 CPU / 8Gi・limits
  #   16 CPU / 32Gi で収まる控えめな値にしている（Playwright + Chromium 1 本に十分な
  #   上限 4Gi）。init container は本体と同時には動かないため quota 上は max で数え
  #   られるが、本体に sidecar を足すと 1 Pod あたりの既定値はその分だけ増える。
  #   recipe が quota をこれより小さく上書きした場合や、より大きな資源が要る Job は、
  #   Job 側で resources を明示すること（明示値が LimitRange の既定値より優先される）。
  #   requests を既定 limit（2 CPU / 4Gi）より大きくする場合は limits も併記すること
  #   （requests だけだと既定 limit が付いて requests > limits となり、Pod が拒否される）。
  #
  # NetworkPolicy（受信を既定拒否、送信は無制限）: ファイル冒頭「ネットワーク分離」参照。
  ansible.builtin.copy:
    dest: "{{ e2e_runner_k8s_manifest_dir }}/namespace-guardrails.yaml"
    owner: root
    group: root
    mode: '0600'
    content: |
      apiVersion: v1
      kind: ResourceQuota
      metadata:
        name: {{ (e2e_runner_k8s_namespace ~ '-quota') | to_json }}
        namespace: {{ e2e_runner_k8s_namespace | to_json }}
      spec:
        hard:
          requests.cpu: {{ e2e_runner_k8s_quota_cpu_requests | to_json }}
          requests.memory: {{ e2e_runner_k8s_quota_memory_requests | to_json }}
          limits.cpu: {{ e2e_runner_k8s_quota_cpu_limits | to_json }}
          limits.memory: {{ e2e_runner_k8s_quota_memory_limits | to_json }}
          pods: {{ e2e_runner_k8s_quota_pods | to_json }}
      ---
      apiVersion: v1
      kind: LimitRange
      metadata:
        name: {{ (e2e_runner_k8s_namespace ~ '-defaults') | to_json }}
        namespace: {{ e2e_runner_k8s_namespace | to_json }}
      spec:
        limits:
          - type: Container
            default:
              cpu: "2"
              memory: 4Gi
            defaultRequest:
              cpu: 500m
              memory: 1Gi
      ---
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: {{ (e2e_runner_k8s_namespace ~ '-deny-ingress') | to_json }}
        namespace: {{ e2e_runner_k8s_namespace | to_json }}
      spec:
        podSelector: {}
        policyTypes:
          - Ingress
  register: e2e_runner_k8s_quota_manifest

- name: "e2e_runner_k8s : Apply the namespace guardrails (ResourceQuota / LimitRange / NetworkPolicy)"
  ansible.builtin.command:
    argv:
      - "{{ e2e_runner_k8s_kubectl }}"
      - "--kubeconfig={{ e2e_runner_k8s_kubeconfig }}"
      - "--request-timeout=30s"
      - apply
      - -f
      - "{{ e2e_runner_k8s_manifest_dir }}/namespace-guardrails.yaml"
  register: e2e_runner_k8s_quota_apply
  # 1 ファイルに複数オブジェクトがあるため、`'unchanged' not in stdout` だと 1 つでも
  # unchanged があれば他が configured/created でも「変更なし」と報告してしまう。
  # 出力 1 行（= 1 オブジェクト）ごとに判定する。
  changed_when: >-
    e2e_runner_k8s_quota_apply.stdout_lines
    | reject('search', ' unchanged$')
    | list
    | length > 0

- name: "e2e_runner_k8s : Ensure the ServiceAccount exists"
  ansible.builtin.shell: >-
    set -o pipefail &&
    {{ e2e_runner_k8s_kubectl }} --kubeconfig={{ e2e_runner_k8s_kubeconfig }} --request-timeout=30s
    -n {{ e2e_runner_k8s_namespace }}
    create serviceaccount {{ e2e_runner_k8s_service_account_name }}
    --dry-run=client -o yaml
    | {{ e2e_runner_k8s_kubectl }} --kubeconfig={{ e2e_runner_k8s_kubeconfig }} --request-timeout=30s
    apply -f -
  args:
    executable: /bin/bash
  register: e2e_runner_k8s_sa_apply
  changed_when: "'unchanged' not in e2e_runner_k8s_sa_apply.stdout"

- name: "e2e_runner_k8s : Write the Role/RoleBinding manifest"
  # namespace 限定（ClusterRole ではない）。jobs/pods/pods-log 以外へは一切
  # アクセスできない（ファイル冒頭「最小権限」参照）。秘匿値は含まない。
  ansible.builtin.copy:
    dest: "{{ e2e_runner_k8s_manifest_dir }}/rbac.yaml"
    owner: root
    group: root
    mode: '0600'
    content: |
      apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata:
        name: {{ e2e_runner_k8s_role_name | to_json }}
        namespace: {{ e2e_runner_k8s_namespace | to_json }}
      rules:
        - apiGroups: ["batch"]
          resources: ["jobs"]
          verbs: ["get", "list", "watch", "create", "delete"]
        - apiGroups: [""]
          resources: ["pods"]
          verbs: ["get", "list", "watch", "delete"]
        - apiGroups: [""]
          resources: ["pods/log"]
          verbs: ["get"]
      ---
      apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: {{ e2e_runner_k8s_role_binding_name | to_json }}
        namespace: {{ e2e_runner_k8s_namespace | to_json }}
      subjects:
        - kind: ServiceAccount
          name: {{ e2e_runner_k8s_service_account_name | to_json }}
          namespace: {{ e2e_runner_k8s_namespace | to_json }}
      roleRef:
        kind: Role
        name: {{ e2e_runner_k8s_role_name | to_json }}
        apiGroup: rbac.authorization.k8s.io
  register: e2e_runner_k8s_rbac_manifest

- name: "e2e_runner_k8s : Apply the Role/RoleBinding"
  ansible.builtin.command:
    argv:
      - "{{ e2e_runner_k8s_kubectl }}"
      - "--kubeconfig={{ e2e_runner_k8s_kubeconfig }}"
      - "--request-timeout=30s"
      - apply
      - -f
      - "{{ e2e_runner_k8s_manifest_dir }}/rbac.yaml"
  register: e2e_runner_k8s_rbac_apply
  # Role と RoleBinding の 2 オブジェクトを 1 回で apply するため、guardrails の apply と
  # 同じく出力 1 行（= 1 オブジェクト）ごとに判定する（Role が unchanged・RoleBinding
  # だけ configured の場合に「変更なし」と誤報告しないため）。
  changed_when: >-
    e2e_runner_k8s_rbac_apply.stdout_lines
    | reject('search', ' unchanged$')
    | list
    | length > 0

- name: "e2e_runner_k8s : Write the ServiceAccount token Secret manifest"
  # type: kubernetes.io/service-account-token の Secret は、値を持たない
  # メタデータ（アノテーションで対象 ServiceAccount を指す）だけで作成でき、
  # `.data.token` はコントローラが後から populate する。このマニフェスト自体には
  # 秘匿値は一切含まれない。
  ansible.builtin.copy:
    dest: "{{ e2e_runner_k8s_manifest_dir }}/sa-token-secret.yaml"
    owner: root
    group: root
    mode: '0600'
    content: |
      apiVersion: v1
      kind: Secret
      metadata:
        name: {{ e2e_runner_k8s_sa_token_secret_name | to_json }}
        namespace: {{ e2e_runner_k8s_namespace | to_json }}
        annotations:
          kubernetes.io/service-account.name: {{ e2e_runner_k8s_service_account_name | to_json }}
      type: kubernetes.io/service-account-token
  register: e2e_runner_k8s_sa_token_manifest

- name: "e2e_runner_k8s : Apply the ServiceAccount token Secret"
  ansible.builtin.command:
    argv:
      - "{{ e2e_runner_k8s_kubectl }}"
      - "--kubeconfig={{ e2e_runner_k8s_kubeconfig }}"
      - "--request-timeout=30s"
      - apply
      - -f
      - "{{ e2e_runner_k8s_manifest_dir }}/sa-token-secret.yaml"
  register: e2e_runner_k8s_sa_token_apply
  changed_when: "'unchanged' not in e2e_runner_k8s_sa_token_apply.stdout"

- name: "e2e_runner_k8s : Wait for the ServiceAccount token to be populated"
  # populate 前に読むと空文字列が埋め込まれた壊れた kubeconfig ができるため、文字数
  # のみを確認する（値そのものは登録しない）。
  ansible.builtin.shell: >-
    set -o pipefail &&
    {{ e2e_runner_k8s_kubectl }} --kubeconfig={{ e2e_runner_k8s_kubeconfig }} --request-timeout=30s
    -n {{ e2e_runner_k8s_namespace }}
    get secret {{ e2e_runner_k8s_sa_token_secret_name }}
    -o jsonpath='{.data.token}' | wc -c
  args:
    executable: /bin/bash
  register: e2e_runner_k8s_token_len
  until: e2e_runner_k8s_token_len.stdout | trim | int > 0
  retries: "{{ e2e_runner_k8s_token_secret_retries | int }}"
  delay: "{{ e2e_runner_k8s_token_secret_delay_seconds | int }}"
  changed_when: false

- name: "e2e_runner_k8s : Ensure the output kubeconfig directory exists"
  # このディレクトリが symlink でないことは「Ensure the manifest directory exists」
  # より前に検査済み（「Check the output kubeconfig directory is not a pre-existing
  # symlink」参照）。
  # owner は root・group は mbc・mode 0750（mbc に書き込み権を与えない）。
  # ディレクトリ自体を mbc 所有 0700 にすると、mbc がそこへ書き込めるため
  # {{ output_kubeconfig_path }} の位置へ事前にシンボリックリンクを仕掛けられ、
  # 次にこのロールが再実行されたとき、後段の「Generate the scoped kubeconfig」が
  # リンク先（任意の既存ファイル）を書き換えてしまう TOCTOU が成立する。root 所有
  # 0750 ならディレクトリへの書き込みは root のみに限られ、mbc は既存ファイル
  # （kubeconfig 本体、mode 0600 owner=mbc）を読むことだけができる。
  ansible.builtin.file:
    path: "{{ e2e_runner_k8s_output_kubeconfig_path | dirname }}"
    state: directory
    owner: root
    group: mbc
    mode: '0750'

- name: "e2e_runner_k8s : Check the output kubeconfig path itself is not a pre-existing symlink"
  # ディレクトリ側の対策とは別に、ファイルの path 自体が既に symlink として存在
  # している場合を検知する。kubeconfig 本体は一時ファイル→`mv` で置換するため
  # リンク先へは書かないが、後段の「Restrict the output kubeconfig permissions」
  # （`ansible.builtin.file` は既定で symlink を追う）がリンク先を mbc へ chown して
  # しまう。黙って置き換えず運用者に気づかせて止める。
  ansible.builtin.stat:
    path: "{{ e2e_runner_k8s_output_kubeconfig_path }}"
    follow: false
  register: e2e_runner_k8s_output_file_lstat

- name: "e2e_runner_k8s : Fail if the output kubeconfig path is a symlink"
  ansible.builtin.fail:
    msg: >-
      {{ e2e_runner_k8s_output_kubeconfig_path }} already exists as a symlink
      (target: {{ e2e_runner_k8s_output_file_lstat.stat.lnk_target | default('unknown') }}).
      Refusing to write through it. Remove the symlink manually and re-run
      this role.
  when: >-
    e2e_runner_k8s_output_file_lstat.stat.exists | default(false)
    and e2e_runner_k8s_output_file_lstat.stat.islnk | default(false)

- name: "e2e_runner_k8s : Generate the scoped kubeconfig"
  # トークンの取得・decode・埋め込みを 1 回の remote shell 実行内で完結させる。
  # 値はシェル変数 $E2E_TOKEN としてのみ存在し、Ansible の register/set_fact・
  # 生成後にこのタスクが返す結果 JSON のいずれにも載らない（ファイル冒頭「秘匿値の
  # 扱い (b)」参照）。
  #
  # `kubectl config set-credentials --token=...` は使わない: 値がそのプロセスの argv
  # として展開され、実行中は同一ホスト上の他プロセスから `ps` で観測できてしまう
  # （このロールが Secret 作成に `--from-literal=` ではなく `--from-file=` を使う
  # 理由と同じ脅威モデル）。代わりに kubeconfig 全体を heredoc で直接書き出す。
  # heredoc 内のシェル変数展開はファイルへのリダイレクト内容としてのみ存在し、
  # どのプロセスの argv にも現れない。
  #
  # 書き出しは同じディレクトリの一時ファイル（mktemp: 0600・root 所有）へ行い、
  # owner/mode を整えてから `mv` で置換する。出力先へ直接 `cat >` すると、書いている
  # 途中（または失敗時）に切り詰められた・書きかけの kubeconfig を利用者が読みうる。
  # rename は同一ファイルシステム内で原子的で、出力先が symlink でもリンク自体を
  # 置き換える（リンク先へは書かない）。ディレクトリは root:mbc 0750 で mbc は
  # 書き込めないため、一時ファイル名を先回りされることもない。`-T` は出力先が
  # ディレクトリだった場合に中へ移動せず失敗させるため。一時ファイルはトークンを
  # 含むので、失敗時も trap で必ず消す。
  ansible.builtin.shell: |
    set -euo pipefail
    E2E_TOKEN=$({{ e2e_runner_k8s_kubectl }} --kubeconfig={{ e2e_runner_k8s_kubeconfig }} --request-timeout=30s -n {{ e2e_runner_k8s_namespace }} get secret {{ e2e_runner_k8s_sa_token_secret_name }} -o jsonpath='{.data.token}' | base64 -d)
    E2E_CA_B64=$(base64 -w0 /var/lib/rancher/k3s/server/tls/server-ca.crt)
    umask 077
    E2E_TMP=$(mktemp "{{ e2e_runner_k8s_output_kubeconfig_path }}.XXXXXX")
    trap 'rm -f "$E2E_TMP"' EXIT
    cat > "$E2E_TMP" <<KUBECONFIG_EOF
    apiVersion: v1
    kind: Config
    clusters:
      - name: {{ (e2e_runner_k8s_namespace ~ '-cluster') | to_json }}
        cluster:
          server: {{ e2e_runner_k8s_cluster_server_url | to_json }}
          certificate-authority-data: $E2E_CA_B64
    contexts:
      - name: {{ e2e_runner_k8s_namespace | to_json }}
        context:
          cluster: {{ (e2e_runner_k8s_namespace ~ '-cluster') | to_json }}
          user: {{ e2e_runner_k8s_service_account_name | to_json }}
          namespace: {{ e2e_runner_k8s_namespace | to_json }}
    current-context: {{ e2e_runner_k8s_namespace | to_json }}
    users:
      - name: {{ e2e_runner_k8s_service_account_name | to_json }}
        user:
          token: $E2E_TOKEN
    KUBECONFIG_EOF
    # owner/group はインラインリテラル `mbc`（defaults/main.yml 参照）。置換の瞬間から
    # 最終的な所有者・権限になるよう mv の前に整える（後段タスクでも同じ値を強制する）。
    chown mbc:mbc "$E2E_TMP"
    chmod 0600 "$E2E_TMP"
    mv -f -T "$E2E_TMP" "{{ e2e_runner_k8s_output_kubeconfig_path }}"
  args:
    executable: /bin/bash
  # heredoc 経由の書き出しは差分を報告しないため、既存内容と同じでも常に「変更」
  # として扱う（apply の 'unchanged' 判定のような比較手段がない）。
  changed_when: true

- name: "e2e_runner_k8s : Restrict the output kubeconfig permissions"
  # owner/group はインラインリテラル `mbc`（defaults/main.yml 参照）。
  ansible.builtin.file:
    path: "{{ e2e_runner_k8s_output_kubeconfig_path }}"
    owner: mbc
    group: mbc
    mode: '0600'

- name: "e2e_runner_k8s : Create the git deploy token Secret"
  block:
    - name: "e2e_runner_k8s : Create a secure temporary file for the git deploy token"
      ansible.builtin.tempfile:
        state: file
        prefix: e2e_runner_k8s_git_token_
      register: e2e_runner_k8s_git_token_tempfile
      changed_when: false

    - name: "e2e_runner_k8s : Write the git deploy token into its temporary file"
      # `content` は copy モジュール自身が引数仕様で no_log 指定しているため、成功・
      # 失敗・-vvv のいずれでも値は出力されない。`| trim` は必須（改行混入対策、
      # github_runner_k8s と同じ理由）。
      #
      # `diff: false`: `--diff` 付きで実行されると copy は書き込み前後の内容を差分として
      # 出力する（content の no_log とは別経路）。トークンを差分に出さない。
      ansible.builtin.copy:
        content: "{{ e2e_runner_k8s_git_deploy_token | trim }}"
        dest: "{{ e2e_runner_k8s_git_token_tempfile.path }}"
        mode: '0600'
      diff: false
      changed_when: true

    - name: "e2e_runner_k8s : Apply the git deploy token Secret"
      ansible.builtin.shell: >-
        set -o pipefail &&
        {{ e2e_runner_k8s_kubectl }} --kubeconfig={{ e2e_runner_k8s_kubeconfig }} --request-timeout=30s
        -n {{ e2e_runner_k8s_namespace }}
        create secret generic {{ e2e_runner_k8s_git_secret_name }}
        --from-file=git_token={{ e2e_runner_k8s_git_token_tempfile.path }}
        --dry-run=client -o yaml
        | {{ e2e_runner_k8s_kubectl }} --kubeconfig={{ e2e_runner_k8s_kubeconfig }} --request-timeout=30s
        apply -f -
      args:
        executable: /bin/bash
      register: e2e_runner_k8s_git_secret_apply
      changed_when: "'unchanged' not in e2e_runner_k8s_git_secret_apply.stdout"
  always:
    - name: "e2e_runner_k8s : Remove the git deploy token temporary file"
      ansible.builtin.file:
        path: "{{ e2e_runner_k8s_git_token_tempfile.path }}"
        state: absent
      when: e2e_runner_k8s_git_token_tempfile.path is defined
      changed_when: false
