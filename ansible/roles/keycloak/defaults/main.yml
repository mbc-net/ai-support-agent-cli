---
# Existing host HTTPS proxy required. Only the container HTTP port is exposed,
# bound to loopback; PostgreSQL stays private. See README.md for prerequisites.
keycloak_version: "26.7.4"
keycloak_postgres_version: "16.15"
keycloak_hostname: ""
keycloak_http_port: 8080
keycloak_proxy_headers: xforwarded
# Required: the source address as seen INSIDE the container (usually the Docker
# bridge gateway for a host proxy), not necessarily 127.0.0.1.
keycloak_proxy_trusted_addresses: []
keycloak_admin_username: bootstrap-admin
keycloak_admin_password: ""
keycloak_db_password: ""
keycloak_start_timeout: 300
