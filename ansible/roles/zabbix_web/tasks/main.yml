---
- name: "zabbix_web : Validate branch and required variables"
  ansible.builtin.assert:
    that:
      - ansible_distribution | default('') == 'Ubuntu'
      - ansible_distribution_version | default('') in ['22.04', '24.04', '26.04']
      - ansible_architecture | default('') in ['x86_64', 'aarch64']
      - zabbix_web_install_method == 'package'
      - zabbix_web_version in ['6.0', '7.0', '8.0']
      # 8.0 needs PHP >= 8.2 and PostgreSQL >= 15 and is validated on 26.04 only.
      - ansible_distribution_version == '26.04' or zabbix_web_version in ['6.0', '7.0']
      - ansible_distribution_version != '26.04' or zabbix_web_version in ['7.0', '8.0']
      # Python 3.14 on 26.04 requires a supported controller. This guard runs
      # after fact gathering; callers must select that controller before setup.
      - ansible_distribution_version != '26.04' or ansible_version.full is version('2.20', '>=')
      - zabbix_web_type in ['nginx', 'apache']
      - zabbix_web_db_type in ['postgresql', 'mysql']
      - zabbix_web_server_name is string and zabbix_web_server_name is match('^[A-Za-z0-9][A-Za-z0-9.-]*\Z')
      - zabbix_web_php_timezone is string and zabbix_web_php_timezone is match('^[A-Za-z][A-Za-z0-9_+/-]*\Z')
      - zabbix_web_db_host is string and zabbix_web_db_host is match('^[A-Za-z0-9][A-Za-z0-9.:-]*\Z')
      - zabbix_web_zbx_server_host is string and zabbix_web_zbx_server_host is match('^[A-Za-z0-9][A-Za-z0-9.:-]*\Z')
      - zabbix_web_db_name is string and zabbix_web_db_name is match('^[a-z][a-z0-9_]{0,62}\Z')
      - zabbix_web_db_user is string and zabbix_web_db_user is match('^[a-z][a-z0-9_]{0,31}\Z')
      - zabbix_web_db_password is string and zabbix_web_db_password | length > 0
      - zabbix_web_db_password is match('^[\x20-\x7e]+\Z') and zabbix_web_db_password == zabbix_web_db_password | trim
      - zabbix_web_db_port | string is match('^[0-9]+\Z')
      - zabbix_web_db_port | int > 0 and zabbix_web_db_port | int < 65536
      - zabbix_web_zbx_server_port | string is match('^[0-9]+\Z')
      - zabbix_web_zbx_server_port | int > 0 and zabbix_web_zbx_server_port | int < 65536
      - zabbix_web_listen_port | string is match('^[0-9]+\Z')
      - zabbix_web_listen_port | int > 0 and zabbix_web_listen_port | int < 65536
      - zabbix_web_type != 'apache' or zabbix_web_listen_port | int not in [80, 443]
      # 待受アドレス（defaults 参照）。空 = 全 interface、"127.0.0.1" = loopback のみ。
      # 確認処理（ログイン画面・API ヘルパー）が 127.0.0.1 へ接続するため他の値は拒否する。
      - zabbix_web_listen_address is string
      - zabbix_web_listen_address in ['', '127.0.0.1']
      - zabbix_web_listen_address | length == 0 or zabbix_web_type == 'nginx'
      - zabbix_web_listen_address | length == 0 or zabbix_web_allowed_sources | length == 0
      # ufw の許可元（§3.6.1）。ufw.yml にも同じ検証があるが、パッケージ導入より前に
      # 落とすためここでも検証する。`is boolean` で型まで見る（"yes" や null を通さない）。
      - zabbix_web_ufw_manage is boolean
      - zabbix_web_allow_no_sources is boolean
      - >-
        zabbix_web_allowed_sources is sequence and zabbix_web_allowed_sources is not string
        and zabbix_web_allowed_sources is not mapping
      - zabbix_web_allowed_sources | reject('string') | list | length == 0
      # オクテット 0〜255（先頭ゼロなし）、プレフィックス 1〜32（/0 は全開放なので拒否）。
      - >-
        zabbix_web_allowed_sources
        | reject('match', '^(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])(\.(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])){3}(/([1-9]|[12][0-9]|3[0-2]))?\Z')
        | list | length == 0
      # ホストビット付き CIDR（例 10.0.0.5/24）は拒否する。ufw は 10.0.0.0/24 に正規化して
      # 保存するため、書いた範囲と開く範囲が食い違う。計算は下の vars（上の検証を通った値だけが届く）。
      - zabbix_web_ufw_host_bit_sources | trim | length == 0
      - not zabbix_web_ufw_manage or (zabbix_web_allowed_sources | length) > 0 or zabbix_web_allow_no_sources
      # 管理者パスワード（§4.2）。`is string` で null / true を拒否する。空は「管理しない」。
      # 'zabbix' は長さでも落ちるが、初期値を受け付けないことを明示するため残す。
      - zabbix_web_admin_password is string
      - >-
        zabbix_web_admin_password | length == 0
        or (zabbix_web_admin_password is match('^[\x20-\x7e]{8,72}\Z')
        and zabbix_web_admin_password == zabbix_web_admin_password | trim
        and zabbix_web_admin_password != 'zabbix')
      - zabbix_web_admin_previous_password is string
      - zabbix_web_admin_previous_password is match('^[\x20-\x7e]{0,72}\Z')
      # ハウスキーピング（§4.2）。キーの allowlist と値の規則は下の task vars のリテラル
      # （files/zabbix_api.py と同じ）。housekeeping.update は Super admin のみ実行できるため、
      # 空でなければ管理者パスワードを要求する。
      - zabbix_web_housekeeping is mapping
      - zabbix_web_housekeeping_invalid | int == 0
      - zabbix_web_housekeeping | length == 0 or zabbix_web_admin_password | length > 0 or zabbix_web_api_token | length > 0
      # API トークンと SAML（ZABBIX.md「SAML（SSO）」）。既定値ではすべて真になり、従来の動作は変わらない。
      # 同じ規則を files/zabbix_api.py にも持つ。SAML の条件は zabbix_web_saml_enabled のときだけ評価される。
      - zabbix_web_api_token is string and zabbix_web_api_token is match('^([0-9a-f]{64})?\Z')
      - zabbix_web_saml_enabled is boolean
      - zabbix_web_admin_lockdown is boolean and zabbix_web_admin_lockdown_delete_tokens is boolean
      # Admin の処置は SAML とトークンの実行が前提（SAML が無ければ画面に誰も入れなくなる）。
      - not zabbix_web_admin_lockdown or (zabbix_web_api_token | length > 0 and zabbix_web_saml_enabled)
      - not zabbix_web_saml_enabled or zabbix_web_version in ['7.0', '8.0']
      - not zabbix_web_saml_enabled or zabbix_web_api_token | length > 0 or zabbix_web_admin_password | length > 0
      - >-
        not zabbix_web_saml_enabled or (zabbix_web_saml_public_url is string
        and zabbix_web_saml_public_url is match('^https://[A-Za-z0-9.-]+(:[0-9]{1,5})?/([A-Za-z0-9._~-]+/)*\Z'))
      - >-
        not zabbix_web_saml_enabled or (zabbix_web_saml_idp_entityid is string
        and zabbix_web_saml_idp_entityid | length <= 1024
        and (zabbix_web_saml_idp_entityid is match('^https://[A-Za-z0-9.-]+(:[0-9]{1,5})?(/[\x21-\x7e]*)?\Z')
        or zabbix_web_saml_idp_entityid is match('^urn:[A-Za-z0-9][A-Za-z0-9-]{0,31}:[\x21-\x7e]+\Z')))
      - >-
        not zabbix_web_saml_enabled or (zabbix_web_saml_sso_url is string and zabbix_web_saml_sso_url | length <= 2048
        and zabbix_web_saml_sso_url is match('^https://[A-Za-z0-9.-]+(:[0-9]{1,5})?(/[\x21-\x7e]*)?\Z'))
      - >-
        not zabbix_web_saml_enabled or (zabbix_web_saml_slo_url is string and zabbix_web_saml_slo_url | length <= 2048
        and zabbix_web_saml_slo_url is match('^(https://[A-Za-z0-9.-]+(:[0-9]{1,5})?(/[\x21-\x7e]*)?)?\Z'))
      - not zabbix_web_saml_enabled or (zabbix_web_saml_sp_entityid is string and zabbix_web_saml_sp_entityid is match('^[\x21-\x7e]{1,1024}\Z'))
      - >-
        not zabbix_web_saml_enabled or zabbix_web_saml_nameid_format in
        ['urn:oasis:names:tc:SAML:2.0:nameid-format:persistent', 'urn:oasis:names:tc:SAML:1.1:nameid-format:unspecified']
      - >-
        not zabbix_web_saml_enabled or (zabbix_web_saml_username_attribute is string
        and zabbix_web_saml_username_attribute is match('^[A-Za-z][A-Za-z0-9_.:-]{0,127}\Z'))
      - not zabbix_web_saml_enabled or (zabbix_web_saml_case_sensitive is boolean and zabbix_web_saml_allow_legacy_users is boolean)
      - not zabbix_web_saml_enabled or zabbix_web_saml_sign_check | trim == 'ok'
      - not zabbix_web_saml_enabled or zabbix_web_saml_certificates_check | trim == 'ok'
      - >-
        not zabbix_web_saml_enabled or (zabbix_web_saml_autologout is string
        and (zabbix_web_saml_autologout == '' or (zabbix_web_saml_autologout is match('^[0-9]{1,5}[smhd]?\Z')
        and zabbix_web_saml_autologout_seconds | int >= 90 and zabbix_web_saml_autologout_seconds | int <= 86400)))
      - not zabbix_web_saml_enabled or zabbix_web_saml_jit_check | trim == 'ok'
      - not zabbix_web_saml_enabled or zabbix_web_saml_user_groups_check | trim == 'ok'
      - zabbix_web_saml_local_users is mapping
      - zabbix_web_saml_local_users.mode | default('') == '' or zabbix_web_saml_enabled
      - not zabbix_web_saml_enabled or zabbix_web_saml_local_users_check | trim == 'ok'
      # 計算は ZABBIX.md の手順と同じ（バイト順に並べて改行で結合、末尾の改行なし）。YAML の二重引用符の
      # \n は改行文字になる。対象は印字可能 ASCII に限っているので、大小文字を区別する並びがバイト順と一致する。
      - "not zabbix_web_saml_enabled or zabbix_web_saml_local_users.mode | default('') == ''
        or zabbix_web_saml_local_users.targets | sort(case_sensitive=true) | join('\n') | hash('sha256')
        == zabbix_web_saml_local_users.expected_sha256"
      - >-
        zabbix_web_locales is sequence and zabbix_web_locales is not string
        and zabbix_web_locales is not mapping
      - zabbix_web_locales | reject('string') | list | length == 0
      - zabbix_web_locales | reject('match', '^[a-z]{2,3}_[A-Z]{2}\.UTF-8\Z') | list | length == 0
      - zabbix_web_locales | length <= 16
      - zabbix_web_locales | unique(case_sensitive=true) | list | length == zabbix_web_locales | length
      - zabbix_web_locales | length == 0 or ansible_distribution_version == '26.04'
    fail_msg: >-
      Zabbix Web requires Ubuntu 22.04/24.04 with LTS 6.0/7.0, or Ubuntu 26.04
      with LTS 7.0/8.0 and ansible-core 2.20 or newer; package install only.
      zabbix_web_locales must be a list of at most 16 unique locale strings such as
      ja_JP.UTF-8 (not ja_JP.utf8); non-empty lists require Ubuntu 26.04.
      nginx/apache, PostgreSQL/MySQL, a server name, a single-line printable ASCII
      DB password and valid connection ports. Configure the DB with zabbix_server
      first. Apache uses a dedicated Listen port; choose a free port other than 80/443.
      zabbix_web_listen_address must be empty or 127.0.0.1 (nginx only) and 127.0.0.1
      cannot be combined with zabbix_web_allowed_sources.
      zabbix_web_allowed_sources must be a list of IPv4 addresses or network-address CIDRs
      (prefix 1-32; a CIDR with host bits set such as 10.0.0.5/24 is rejected, write
      10.0.0.0/24), zabbix_web_ufw_manage and zabbix_web_allow_no_sources must be booleans,
      and an empty zabbix_web_allowed_sources with zabbix_web_ufw_manage true needs
      zabbix_web_allow_no_sources true.
      zabbix_web_admin_password must be a string, either empty or 8-72 printable ASCII
      characters without leading/trailing spaces and not the initial password zabbix;
      zabbix_web_admin_previous_password must be a string of 0-72 printable ASCII characters.
      zabbix_web_housekeeping must be a mapping of writable housekeeping keys only
      (hk_events_mode, hk_events_trigger, hk_events_service, hk_events_internal,
      hk_events_discovery, hk_events_autoreg, hk_services_mode, hk_services, hk_audit_mode,
      hk_audit, hk_sessions_mode, hk_sessions, hk_history_mode, hk_history_global, hk_history,
      hk_trends_mode, hk_trends_global, hk_trends, compression_status, compress_older;
      db_extension and compression_availability are read-only). Mode, global and
      compression_status values are 0 or 1 (integer or string, not boolean). Periods are
      seconds or a number with an s/m/h/d/w suffix (no macros, y/M units or spaces):
      retention periods 1d-25y, hk_history 0 or 1h-25y, hk_trends 0 or 1d-25y,
      compress_older 7d-25y. A non-empty zabbix_web_housekeeping requires
      zabbix_web_admin_password or zabbix_web_api_token.
      zabbix_web_api_token must be empty or 64 lowercase hex characters; zabbix_web_admin_lockdown
      and zabbix_web_admin_lockdown_delete_tokens are booleans, and the lockdown requires
      zabbix_web_api_token and zabbix_web_saml_enabled. zabbix_web_saml_enabled is a boolean; SAML
      needs zabbix_web_version 7.0 or 8.0, zabbix_web_api_token (or zabbix_web_admin_password for
      the one-time service user bootstrap), an https zabbix_web_saml_public_url ending with a slash
      and without query or fragment, an https URL or URN zabbix_web_saml_idp_entityid (max 1024),
      an https zabbix_web_saml_sso_url, an empty or https zabbix_web_saml_slo_url, a printable ASCII
      zabbix_web_saml_sp_entityid without spaces (1-1024), one of the persistent (SAML 2.0) or
      unspecified (SAML 1.1) NameID format URNs, a valid zabbix_web_saml_username_attribute, boolean
      zabbix_web_saml_case_sensitive and zabbix_web_saml_allow_legacy_users, a mapping
      zabbix_web_saml_sign with only messages, assertions, authn_requests, logout_requests and
      logout_responses (booleans; messages or assertions must stay true), one or two PEM certificates in zabbix_web_saml_idp_certificates,
      both or neither of zabbix_web_saml_sp_certificate and zabbix_web_saml_sp_private_key (PEM,
      unencrypted key; required when authn_requests or a logout signature is on), an empty or
      90s-1d zabbix_web_saml_autologout, and a valid zabbix_web_saml_jit (with JIT: attributes,
      a deprovisioned_group and at least one groups entry of saml_group without "*", a role that
      is not Super admin role and user_groups). zabbix_web_saml_user_groups is a list of entries with
      exactly name (a user group other than the API-only, deprovisioned or Zabbix administrators group;
      unique ignoring case), permission (read or read-write) and hostgroups (all or a non-empty list of
      unique host group names in printable ASCII). zabbix_web_saml_local_users is a mapping whose mode
      is empty, delete or scramble (only with SAML); a mode needs 1-200 unique targets (printable
      ASCII without spaces, max 100, not Admin or the service user) and expected_sha256 equal to
      the sha256 of the targets sorted by bytes and joined with newlines (see ZABBIX.md).
  # assert の that は式しか書けず、要素ごとの算術（ホストビットの判定）はループ構文が要るため
  # task vars で計算する。that の評価は先頭から順で最初の偽で止まり、task vars は参照時に
  # 評価されるので、ここへ届くのはリスト・文字列・アドレス形式の検証を通った値だけである。
  # この名前はレシピから上書きできないよう、ガードの予約内部変数に載せている。
  vars:
    zabbix_web_ufw_host_bit_sources: >-
      {%- set out = [] -%}
      {%- for src in zabbix_web_allowed_sources | select('search', '/') -%}
      {%-   set o = src.split('/')[0].split('.') | map('int') | list -%}
      {%-   if (o[0] * 16777216 + o[1] * 65536 + o[2] * 256 + o[3]) % (2 ** (32 - (src.split('/')[1] | int))) != 0 -%}
      {%-     set _ = out.append(src) -%}
      {%-   endif -%}
      {%- endfor -%}
      {{ out | join(',') }}
    # 不正なハウスキーピング指定の件数（空文字キーも数えるため、名前の連結ではなく件数で返す）。zabbix_web_housekeeping is mapping を
    # 通った値だけが届く。キーの allowlist（20 個）はここと files/zabbix_api.py のリテラルで持ち、
    # vars/main.yml には置かない（レシピから上書きされ得るため。設計書 §6.1）。
    # 期間の上限 25y は Zabbix と同じ 25 × 365 日（788400000 秒）。
    zabbix_web_housekeeping_invalid: >-
      {%- set mode_keys = ['hk_events_mode', 'hk_services_mode', 'hk_audit_mode', 'hk_sessions_mode',
                           'hk_history_mode', 'hk_trends_mode', 'hk_history_global', 'hk_trends_global',
                           'compression_status'] -%}
      {%- set period_keys = {'hk_events_trigger': [86400, false], 'hk_events_service': [86400, false],
                             'hk_events_internal': [86400, false], 'hk_events_discovery': [86400, false],
                             'hk_events_autoreg': [86400, false], 'hk_services': [86400, false],
                             'hk_audit': [86400, false], 'hk_sessions': [86400, false],
                             'hk_history': [3600, true], 'hk_trends': [86400, true],
                             'compress_older': [604800, false]} -%}
      {%- set units = {'s': 1, 'm': 60, 'h': 3600, 'd': 86400, 'w': 604800} -%}
      {%- set out = [] -%}
      {%- for key, value in zabbix_web_housekeeping.items() -%}
      {%-   if key in mode_keys -%}
      {%-     if value is boolean or not ((value is integer and value in [0, 1]) or (value is string and value in ['0', '1'])) -%}
      {%-       set _ = out.append(key) -%}
      {%-     endif -%}
      {%-   elif key in period_keys -%}
      {%-     set ns = namespace(secs=-1) -%}
      {%-     if value is boolean -%}
      {%-       set ns.secs = -1 -%}
      {%-     elif value is integer -%}
      {%-       set ns.secs = value -%}
      {%-     elif value is string and value is match('^[0-9]{1,10}[smhdw]?\Z') -%}
      {%-       set ns.secs = (value[:-1] | int) * units[value[-1]] if value[-1] in units else value | int -%}
      {%-     endif -%}
      {%-     if not ((period_keys[key][1] and ns.secs == 0) or (ns.secs >= period_keys[key][0] and ns.secs <= 788400000)) -%}
      {%-       set _ = out.append(key) -%}
      {%-     endif -%}
      {%-   else -%}
      {%-     set _ = out.append(key | string) -%}
      {%-   endif -%}
      {%- endfor -%}
      {{ out | length }}
    # SAML の入れ子の値の検査（files/zabbix_api.py と同じ規則）。zabbix_web_saml_enabled のときだけ
    # that から参照される。正しければ ok、そうでなければ不正な項目の名前（値は返さない）を返す
    # （空文字の結果は ansible-core 2.19 以降で None になり得るため、空を「正しい」に使わない）。
    zabbix_web_saml_sign_check: >-
      {%- set out = [] -%}
      {%- set sign = zabbix_web_saml_sign -%}
      {%- if sign is not mapping -%}
      {%-   set _ = out.append('sign') -%}
      {%- elif sign | list | difference(['messages', 'assertions', 'authn_requests', 'logout_requests', 'logout_responses']) | length > 0 -%}
      {%-   set _ = out.append('sign keys') -%}
      {%- elif sign.values() | reject('boolean') | list | length > 0 -%}
      {%-   set _ = out.append('sign values') -%}
      {%- elif not (sign.messages | default(true) or sign.assertions | default(true)) -%}
      {%-   set _ = out.append('sign messages or assertions') -%}
      {%- endif -%}
      {{ out | join(',') or 'ok' }}
    zabbix_web_saml_certificates_check: >-
      {%- set out = [] -%}
      {%- set certs = zabbix_web_saml_idp_certificates -%}
      {%- set cert_pem = '^-----BEGIN CERTIFICATE-----\n([A-Za-z0-9+/=]{1,76}\n)+-----END CERTIFICATE-----\n?\Z' -%}
      {%- set key_pem = '^-----BEGIN (RSA |EC )?PRIVATE KEY-----\n([A-Za-z0-9+/=]{1,76}\n)+-----END (RSA |EC )?PRIVATE KEY-----\n?\Z' -%}
      {%- if certs is string or certs is mapping or certs is not sequence or certs | length < 1 or certs | length > 2 -%}
      {%-   set _ = out.append('idp_certificates') -%}
      {%- elif certs | reject('string') | list | length > 0 or certs | reject('match', cert_pem) | list | length > 0 -%}
      {%-   set _ = out.append('idp_certificates') -%}
      {%- endif -%}
      {%- set sp_cert = zabbix_web_saml_sp_certificate -%}
      {%- set sp_key = zabbix_web_saml_sp_private_key -%}
      {%- set sp_needed = zabbix_web_saml_sign.authn_requests | default(false) or zabbix_web_saml_sign.logout_requests | default(false)
                          or zabbix_web_saml_sign.logout_responses | default(false) -%}
      {%- if sp_cert is not string or sp_key is not string -%}
      {%-   set _ = out.append('sp') -%}
      {%- elif (sp_cert == '') != (sp_key == '') or (sp_cert == '' and sp_needed) -%}
      {%-   set _ = out.append('sp') -%}
      {%- elif sp_cert != '' and not (sp_cert is match(cert_pem) and sp_key is match(key_pem)) -%}
      {%-   set _ = out.append('sp') -%}
      {%- endif -%}
      {{ out | join(',') or 'ok' }}
    zabbix_web_saml_autologout_seconds: >-
      {{ (zabbix_web_saml_autologout[:-1] | int) * {'s': 1, 'm': 60, 'h': 3600, 'd': 86400}[zabbix_web_saml_autologout[-1]]
         if zabbix_web_saml_autologout[-1] in ['s', 'm', 'h', 'd'] else zabbix_web_saml_autologout | int }}
    zabbix_web_saml_jit_check: >-
      {%- set out = [] -%}
      {%- set jit = zabbix_web_saml_jit -%}
      {%- set attribute = '^[A-Za-z][A-Za-z0-9_.:-]{0,127}\Z' -%}
      {%- set optional_attribute = '^([A-Za-z][A-Za-z0-9_.:-]{0,127})?\Z' -%}
      {%- set object_name = '^[\x21-\x7e]([\x20-\x7e]{0,62}[\x21-\x7e])?\Z' -%}
      {%- set saml_group = '^[\x21-\x29\x2b-\x7e]([\x20-\x29\x2b-\x7e]{0,253}[\x21-\x29\x2b-\x7e])?\Z' -%}
      {%- if jit is not mapping or jit | list | difference(['enabled', 'group_name_attribute', 'user_name_attribute',
            'user_lastname_attribute', 'deprovisioned_group', 'groups', 'media']) | length > 0 -%}
      {%-   set _ = out.append('jit') -%}
      {%- elif jit.enabled | default(false) is not boolean -%}
      {%-   set _ = out.append('jit.enabled') -%}
      {%- elif jit.enabled | default(false) -%}
      {%-   set group_attribute = jit.group_name_attribute | default('groups') -%}
      {%-   set name_attribute = jit.user_name_attribute | default('name') -%}
      {%-   set lastname_attribute = jit.user_lastname_attribute | default('') -%}
      {%-   set deprovisioned = jit.deprovisioned_group | default('') -%}
      {%-   if group_attribute is not string or group_attribute is not match(attribute) -%}
      {%-     set _ = out.append('jit.group_name_attribute') -%}
      {%-   endif -%}
      {%-   if name_attribute is not string or name_attribute is not match(optional_attribute) -%}
      {%-     set _ = out.append('jit.user_name_attribute') -%}
      {%-   endif -%}
      {%-   if lastname_attribute is not string or lastname_attribute is not match(optional_attribute) -%}
      {%-     set _ = out.append('jit.user_lastname_attribute') -%}
      {%-   endif -%}
      {%-   if deprovisioned is not string or deprovisioned is not match(object_name)
              or deprovisioned == 'AI support automation (API only)' -%}
      {%-     set _ = out.append('jit.deprovisioned_group') -%}
      {%-   endif -%}
      {%-   set groups = jit.groups | default([]) -%}
      {%-   if groups is string or groups is mapping or groups is not sequence or groups | length == 0 -%}
      {%-     set _ = out.append('jit.groups') -%}
      {%-   else -%}
      {%-     for entry in groups -%}
      {%-       if entry is not mapping or entry | list | sort != ['role', 'saml_group', 'user_groups'] -%}
      {%-         set _ = out.append('jit.groups') -%}
      {%-       elif entry.saml_group is not string or entry.saml_group is not match(saml_group)
                  or entry.role is not string or entry.role is not match(object_name) or entry.role == 'Super admin role' -%}
      {%-         set _ = out.append('jit.groups') -%}
      {%-       elif entry.user_groups is string or entry.user_groups is mapping or entry.user_groups is not sequence
                  or entry.user_groups | length == 0 or entry.user_groups | reject('string') | list | length > 0
                  or entry.user_groups | reject('match', object_name) | list | length > 0
                  or entry.user_groups | unique(case_sensitive=true) | list | length != entry.user_groups | length
                  or deprovisioned in entry.user_groups or 'AI support automation (API only)' in entry.user_groups -%}
      {%-         set _ = out.append('jit.groups') -%}
      {%-       endif -%}
      {%-     endfor -%}
      {%-     if out | length == 0 and groups | map(attribute='saml_group') | unique(case_sensitive=true) | list | length != groups | length -%}
      {%-       set _ = out.append('jit.groups') -%}
      {%-     endif -%}
      {%-   endif -%}
      {%-   set media = jit.media | default([]) -%}
      {%-   if media is string or media is mapping or media is not sequence -%}
      {%-     set _ = out.append('jit.media') -%}
      {%-   else -%}
      {%-     for entry in media -%}
      {%-       if entry is not mapping or entry | list | sort != ['attribute', 'mediatype', 'name']
                  or entry.name is not string or entry.name is not match(object_name)
                  or entry.mediatype is not string or entry.mediatype is not match(object_name)
                  or entry.attribute is not string or entry.attribute is not match(attribute) -%}
      {%-         set _ = out.append('jit.media') -%}
      {%-       endif -%}
      {%-     endfor -%}
      {%-   endif -%}
      {%- endif -%}
      {{ out | unique | join(',') or 'ok' }}
    # 管理するユーザーグループ（files/zabbix_api.py の validate_user_groups と同じ規則）。保護するグループの名前と
    # 重複は大小文字を区別せずに比べる（MySQL の照合順序では大小文字の違うグループに当たり得るため）。
    zabbix_web_saml_user_groups_check: >-
      {%- set out = [] -%}
      {%- set groups = zabbix_web_saml_user_groups -%}
      {%- set object_name = '^[\x21-\x7e]([\x20-\x7e]{0,62}[\x21-\x7e])?\Z' -%}
      {%- set hostgroup_name = '^[\x21-\x7e]([\x20-\x7e]{0,253}[\x21-\x7e])?\Z' -%}
      {%- set deprovisioned = zabbix_web_saml_jit.deprovisioned_group | default('') if zabbix_web_saml_jit is mapping else '' -%}
      {%- set protected = ['ai support automation (api only)', 'zabbix administrators']
                          + ([deprovisioned | lower] if deprovisioned is string and deprovisioned != '' else []) -%}
      {%- if groups is string or groups is mapping or groups is not sequence -%}
      {%-   set _ = out.append('user_groups') -%}
      {%- else -%}
      {%-   for entry in groups -%}
      {%-     if entry is not mapping or entry | list | sort != ['hostgroups', 'name', 'permission'] -%}
      {%-       set _ = out.append('user_groups') -%}
      {%-     elif entry.name is not string or entry.name is not match(object_name) or entry.name | lower in protected -%}
      {%-       set _ = out.append('user_groups.name') -%}
      {%-     elif entry.permission is not string or entry.permission not in ['read', 'read-write'] -%}
      {%-       set _ = out.append('user_groups.permission') -%}
      {%-     elif entry.hostgroups is string and entry.hostgroups == 'all' -%}
      {%-     elif entry.hostgroups is string or entry.hostgroups is mapping or entry.hostgroups is not sequence
                or entry.hostgroups | length == 0 or entry.hostgroups | reject('string') | list | length > 0
                or entry.hostgroups | reject('match', hostgroup_name) | list | length > 0
                or entry.hostgroups | unique(case_sensitive=true) | list | length != entry.hostgroups | length -%}
      {%-       set _ = out.append('user_groups.hostgroups') -%}
      {%-     endif -%}
      {%-   endfor -%}
      {%-   if out | length == 0 and groups | map(attribute='name') | map('lower') | unique | list | length != groups | length -%}
      {%-     set _ = out.append('user_groups.name') -%}
      {%-   endif -%}
      {%- endif -%}
      {{ out | unique | join(',') or 'ok' }}
    zabbix_web_saml_local_users_check: >-
      {%- set out = [] -%}
      {%- set local = zabbix_web_saml_local_users -%}
      {%- set mode = local.mode | default('') -%}
      {%- set targets = local.targets | default([]) -%}
      {%- if local | list | difference(['mode', 'targets', 'expected_sha256', 'transfer_maps_dashboards']) | length > 0 -%}
      {%-   set _ = out.append('local_users') -%}
      {%- elif mode is not string or mode not in ['', 'delete', 'scramble'] -%}
      {%-   set _ = out.append('local_users.mode') -%}
      {%- elif local.transfer_maps_dashboards | default(false) is not boolean -%}
      {%-   set _ = out.append('local_users.transfer_maps_dashboards') -%}
      {%- elif mode != '' -%}
      {%-   if targets is string or targets is mapping or targets is not sequence or targets | length < 1 or targets | length > 200
              or targets | reject('string') | list | length > 0 or targets | reject('match', '^[\x21-\x7e]{1,100}\Z') | list | length > 0
              or targets | map('lower') | select('in', ['admin', 'ai-support-automation']) | list | length > 0
              or targets | unique(case_sensitive=true) | list | length != targets | length -%}
      {%-     set _ = out.append('local_users.targets') -%}
      {%-   endif -%}
      {%-   if local.expected_sha256 | default('') is not string or local.expected_sha256 | default('') is not match('^[0-9a-f]{64}\Z') -%}
      {%-     set _ = out.append('local_users.expected_sha256') -%}
      {%-   endif -%}
      {%- endif -%}
      {{ out | join(',') or 'ok' }}

- name: "zabbix_web : Read existing frontend and server package versions"
  ansible.builtin.command:
    argv: [dpkg-query, -W, '-f=${Version}\n', zabbix-frontend-php, zabbix-server-pgsql, zabbix-server-mysql]
  register: zabbix_web_installed_version
  changed_when: false
  failed_when: zabbix_web_installed_version.rc not in [0, 1]

- name: "zabbix_web : Reject incompatible existing LTS packages"
  ansible.builtin.assert:
    that:
      - >-
        zabbix_web_installed_version.stdout_lines | reject('equalto', '')
        | reject('match', '^([0-9]+:)?' ~ (zabbix_web_version | regex_escape) ~ '\.')
        | list | length == 0
    fail_msg: >-
      Existing Zabbix frontend/server packages use another LTS. Do not change
      their shared repository or upgrade them through this setup. Align Web
      with Server and use the official backed-up upgrade procedure first.

# Ubuntu 26.04 ships PHP 8.5 and PostgreSQL 18. Existing older 7.0
# packages must be upgraded deliberately, not silently retained by state: present.
- name: "zabbix_web : Require the validated patch baseline on Ubuntu 26.04"
  ansible.builtin.assert:
    that:
      - >-
        zabbix_web_installed_version.stdout_lines | reject('equalto', '')
        | map('regex_replace', '^[0-9]+:', '') | map('regex_replace', '-.*$', '')
        | select('version', zabbix_web_min_patch, '<') | list | length == 0
    fail_msg: >-
      Ubuntu 26.04 requires Zabbix {{ zabbix_web_min_patch }} or newer in the {{ zabbix_web_version }}
      series for this setup. Upgrade existing older packages through the backed-up update procedure.
  when: ansible_distribution_version == '26.04'

# Installing locales here could rebuild the archive through its postinst.
# Check all prerequisites before changing repositories or packages.
- name: "zabbix_web : Check locale prerequisites"
  when: zabbix_web_locales | length > 0
  block:
    - name: "zabbix_web : Read the locales package status"
      ansible.builtin.command:
        argv: [dpkg-query, -W, '-f=${Status}', locales]
      register: zabbix_web_locale_package
      changed_when: false
      failed_when: zabbix_web_locale_package.rc not in [0, 1]

    - name: "zabbix_web : Require locales to be installed beforehand"
      ansible.builtin.assert:
        that:
          - zabbix_web_locale_package.rc == 0
          - zabbix_web_locale_package.stdout == 'install ok installed'
        fail_msg: >-
          Install the locales package beforehand and verify existing locales are preserved.
          This role does not install locales because its postinst can rebuild the locale archive.

    - name: "zabbix_web : Require supported locale names"
      ansible.builtin.command:
        argv: [grep, -qxF, "{{ item }} UTF-8", /usr/share/i18n/SUPPORTED]
      loop: "{{ zabbix_web_locales }}"
      register: zabbix_web_locale_supported
      changed_when: false
      failed_when: zabbix_web_locale_supported.rc not in [0, 1]

    - name: "zabbix_web : Assert all locale names are supported"
      ansible.builtin.assert:
        that:
          - zabbix_web_locale_supported.results | rejectattr('rc', 'equalto', 0) | list | length == 0
        fail_msg: >-
          Locales not found in /usr/share/i18n/SUPPORTED: {{ zabbix_web_locale_supported.results | selectattr('rc', 'equalto', 1) | map(attribute='item') | join(', ') }}

- name: "zabbix_web : Install the official repository package"
  ansible.builtin.apt:
    deb: "{{ zabbix_web_release_deb }}"
    state: present
  register: zabbix_web_repo_pkg

- name: "zabbix_web : Converge the architecture-specific repository source"
  ansible.builtin.copy:
    content: |
      Types: deb
      URIs: {{ zabbix_web_repo_uri }}
      Suites: {{ {'22.04': 'jammy', '24.04': 'noble', '26.04': 'resolute'}[ansible_distribution_version] }}
      Components: main
      Signed-By: /usr/share/keyrings/zabbix.gpg
    dest: /etc/apt/sources.list.d/zabbix.sources
    owner: root
    group: root
    mode: "0644"

- name: "zabbix_web : Remove the retired legacy repository source"
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/zabbix.list
    state: absent

# The 8.0 zabbix-release package also ships zabbix-unstable.sources (Enabled: no).
# It is a package conffile, so it is verified rather than rewritten: rc 0 = disabled,
# rc 2 = absent; anything else (e.g. enabled by hand) stops before packages install.
- name: "zabbix_web : Require the packaged unstable repository source to stay disabled"
  ansible.builtin.command:
    argv: [grep, -qx, 'Enabled: no', /etc/apt/sources.list.d/zabbix-unstable.sources]
  register: zabbix_web_unstable_source
  changed_when: false
  failed_when: zabbix_web_unstable_source.rc not in [0, 2]
  when: zabbix_web_version == '8.0'

- name: "zabbix_web : Install the frontend, web server and PHP driver"
  ansible.builtin.apt:
    name:
      - "zabbix-frontend-php={{ zabbix_web_pkg_epoch }}:{{ zabbix_web_version }}.*"
      - "{{ 'zabbix-nginx-conf' if zabbix_web_type == 'nginx' else 'zabbix-apache-conf' }}={{ zabbix_web_pkg_epoch }}:{{ zabbix_web_version }}.*"
      - "{{ 'nginx' if zabbix_web_type == 'nginx' else 'apache2' }}"
      - "php{{ zabbix_web_php_version }}-fpm"
      - "php{{ zabbix_web_php_version }}-cli"
      - "php{{ zabbix_web_php_version }}-{{ 'pgsql' if zabbix_web_db_type == 'postgresql' else 'mysql' }}"
      # ss reads the actual listener (Apply / listener checks).
      - iproute2
    state: present
    update_cache: true
    policy_rc_d: 101

- name: "zabbix_web : Read installed packages after provisioning on Ubuntu 26.04"
  ansible.builtin.command:
    argv: [dpkg-query, -W, '-f=${Version}\n', zabbix-frontend-php, "{{ 'zabbix-nginx-conf' if zabbix_web_type == 'nginx' else 'zabbix-apache-conf' }}"]
  register: zabbix_web_installed_version
  changed_when: false
  when: ansible_distribution_version == '26.04'

- name: "zabbix_web : Verify installed patch baseline before configuration on Ubuntu 26.04"
  ansible.builtin.assert:
    that:
      - zabbix_web_installed_version.stdout_lines | length == 2
      - >-
        zabbix_web_installed_version.stdout_lines
        | reject('match', '^' ~ zabbix_web_pkg_epoch ~ ':' ~ (zabbix_web_version | regex_escape) ~ '\.[0-9]+-')
        | list | length == 0
      - >-
        zabbix_web_installed_version.stdout_lines
        | map('regex_replace', '^[0-9]+:', '') | map('regex_replace', '-.*$', '')
        | select('version', zabbix_web_min_patch, '<') | list | length == 0
    fail_msg: >-
      Installed Zabbix packages must be {{ zabbix_web_min_patch }} or newer in the {{ zabbix_web_version }} series.
      No database initialization or frontend configuration has been performed.
  when: ansible_distribution_version == '26.04'

# SAML（ZABBIX.md「SAML（SSO）」）は Ubuntu の版に関わらず検証済みのパッチ以上に限る
# （CVE-2024-36466 は SSO を使う 7.0.0 が対象。下限はロールの検証済みの 7.0.32・8.0.0）。
# ヘルパーも apiinfo.version の完全な版で同じ下限を確かめる。
- name: "zabbix_web : Read the installed frontend package for the SAML version floor"
  ansible.builtin.command:
    argv: [dpkg-query, -W, '-f=${Version}\n', zabbix-frontend-php]
  register: zabbix_web_saml_installed_version
  changed_when: false
  when: zabbix_web_saml_enabled

- name: "zabbix_web : Require the SAML version floor before configuration"
  ansible.builtin.assert:
    that:
      - zabbix_web_saml_installed_version.stdout_lines | length == 1
      - >-
        zabbix_web_saml_installed_version.stdout_lines
        | map('regex_replace', '^[0-9]+:', '') | map('regex_replace', '-.*$', '')
        | select('version', zabbix_web_min_patch, '<') | list | length == 0
    fail_msg: >-
      SAML requires zabbix-frontend-php {{ zabbix_web_min_patch }} or newer in the {{ zabbix_web_version }}
      series (CVE-2024-36466). Upgrade through the backed-up update procedure first. No frontend
      configuration has been performed.
  when: zabbix_web_saml_enabled

# Ubuntu 26.04 locale-gen with arguments adds only the requested locales.
# Never call it without arguments: existing DB collations must remain available.
- name: "zabbix_web : Ensure requested frontend locales are available"
  when: zabbix_web_locales | length > 0
  block:
    - name: "zabbix_web : Read locales before generation"
      ansible.builtin.command:
        argv: [locale, -a]
      register: zabbix_web_locale_before
      changed_when: false

    - name: "zabbix_web : Check active locale registrations"
      ansible.builtin.command:
        argv: [grep, -qE, "^[[:space:]]*{{ item | replace('.', '[.]') }}[[:space:]]+UTF-8[[:space:]]*$", /etc/locale.gen]
      loop: "{{ zabbix_web_locales }}"
      register: zabbix_web_locale_listed
      changed_when: false
      failed_when: zabbix_web_locale_listed.rc not in [0, 1]

    - name: "zabbix_web : Generate missing locales with explicit arguments"
      ansible.builtin.command:
        argv: [locale-gen, "{{ item }}"]
      vars:
        zabbix_web_locale_missing: >-
          {{ (zabbix_web_locales | map('replace', '.UTF-8', '.utf8')
              | difference(zabbix_web_locale_before.stdout_lines)
              | map('replace', '.utf8', '.UTF-8') | list)
             | union(zabbix_web_locale_listed.results | selectattr('rc', 'equalto', 1)
                     | map(attribute='item') | list) }}
      loop: "{{ zabbix_web_locale_missing }}"
      register: zabbix_web_locale_generated
      changed_when: true

    - name: "zabbix_web : Read locales after generation"
      ansible.builtin.command:
        argv: [locale, -a]
      register: zabbix_web_locale_after
      changed_when: false

    - name: "zabbix_web : Verify requested and existing locales are preserved"
      ansible.builtin.assert:
        that:
          - >-
            zabbix_web_locales | map('replace', '.UTF-8', '.utf8')
            | difference(zabbix_web_locale_after.stdout_lines) | length == 0
          - zabbix_web_locale_before.stdout_lines | difference(zabbix_web_locale_after.stdout_lines) | length == 0
        fail_msg: Requested locales must exist and all previously available locales must be preserved.

    - name: "zabbix_web : Verify persistent locale registrations"
      ansible.builtin.command:
        argv: [grep, -qE, "^[[:space:]]*{{ item | replace('.', '[.]') }}[[:space:]]+UTF-8[[:space:]]*$", /etc/locale.gen]
      loop: "{{ zabbix_web_locales }}"
      register: zabbix_web_locale_registered
      changed_when: false
      failed_when: zabbix_web_locale_registered.rc != 0

    # Read after generation so first runs and interrupted runs both activate the archive.
    - name: "zabbix_web : Read PHP-FPM start time"
      ansible.builtin.command:
        argv: [systemctl, show, "php{{ zabbix_web_php_version }}-fpm", -P, ExecMainStartTimestamp, --timestamp=unix]
      register: zabbix_web_locale_fpm_started
      changed_when: false

    - name: "zabbix_web : Read locale archive modification time"
      ansible.builtin.command:
        argv: [stat, -c, '%Y', /usr/lib/locale/locale-archive]
      register: zabbix_web_locale_archive_mtime
      changed_when: false

- name: "zabbix_web : Disable the packaged nginx virtual host"
  ansible.builtin.file:
    path: /etc/nginx/conf.d/zabbix.conf
    state: absent
  when: zabbix_web_type == 'nginx'

- name: "zabbix_web : Disable the packaged Apache alias"
  ansible.builtin.command:
    argv: [a2disconf, zabbix]
  register: zabbix_web_apache_disable
  changed_when: "'Disabling conf' in zabbix_web_apache_disable.stdout"
  when: zabbix_web_type == 'apache'

- name: "zabbix_web : Enable Apache FastCGI modules"
  ansible.builtin.command:
    argv: [a2enmod, proxy_fcgi, setenvif]
  register: zabbix_web_apache_modules
  changed_when: "'Enabling module' in zabbix_web_apache_modules.stdout"
  when: zabbix_web_type == 'apache'

- name: "zabbix_web : Validate that PHP recognizes the timezone"
  ansible.builtin.command:
    argv:
      - "php{{ zabbix_web_php_version }}"
      - -r
      - "exit(in_array($argv[1], timezone_identifiers_list(DateTimeZone::ALL_WITH_BC), true) ? 0 : 1);"
      - "{{ zabbix_web_php_timezone }}"
  changed_when: false

# SAML の証明書はファイルに置く（7.0 は DB に置けず、8.0 も $SSO['CERT_STORAGE'] = 'file' で揃える）。
# zabbix.conf.php が参照するまでは使われないので、ロールバック block の前に置く。
- name: "zabbix_web : Converge SAML certificate files"
  when: zabbix_web_saml_enabled
  block:
    - name: "zabbix_web : Create the SAML certificate directory"
      ansible.builtin.file:
        path: /etc/zabbix/web/saml
        state: directory
        owner: root
        group: www-data
        mode: "0750"

    - name: "zabbix_web : Write the IdP certificate"
      ansible.builtin.copy:
        content: "{{ zabbix_web_saml_idp_certificates[0] | trim }}\n"
        dest: /etc/zabbix/web/saml/idp.crt
        owner: root
        group: www-data
        mode: "0640"

    - name: "zabbix_web : Write the SP certificate"
      ansible.builtin.copy:
        content: "{{ zabbix_web_saml_sp_certificate | trim }}\n"
        dest: /etc/zabbix/web/saml/sp.crt
        owner: root
        group: www-data
        mode: "0640"
      when: zabbix_web_saml_sp_certificate | length > 0

    # copy の content はモジュールの引数仕様で伏字化されるので no_log は付けない（付けると失敗理由
    # だけが消える）。ループにすると item として値が出力されるので 1 件ずつ書く。diff も止める。
    - name: "zabbix_web : Write the SP private key"
      ansible.builtin.copy:
        content: "{{ zabbix_web_saml_sp_private_key | trim }}\n"
        dest: /etc/zabbix/web/saml/sp.key
        owner: root
        group: www-data
        mode: "0640"
      diff: false
      when: zabbix_web_saml_sp_certificate | length > 0

    - name: "zabbix_web : Remove unused SP certificate and private key"
      ansible.builtin.file:
        path: "/etc/zabbix/web/saml/{{ item }}"
        state: absent
      loop: [sp.crt, sp.key]
      when: zabbix_web_saml_sp_certificate | length == 0

- name: "zabbix_web : Prepare frontend rollback"
  ansible.builtin.tempfile:
    state: directory
    prefix: ai-support-zabbix-web-rollback-
  register: zabbix_web_rollback_dir

- name: "zabbix_web : Update frontend settings with rollback"
  block:
    - name: "zabbix_web : Initialize rollback state for this invocation"
      ansible.builtin.set_fact:
        zabbix_web_activation_started: false
        zabbix_web_rollback_complete: false

    - name: "zabbix_web : Record existing service states"
      ansible.builtin.service_facts:
      register: zabbix_web_services

    - name: "zabbix_web : Record existing frontend settings"
      ansible.builtin.stat:
        path: "{{ item }}"
        get_checksum: false
        get_mime: false
      loop:
        - /etc/zabbix/web/zabbix.conf.php
        - "/etc/php/{{ zabbix_web_php_version }}/fpm/pool.d/ai-support-zabbix.conf"
        - "{{ '/etc/nginx/conf.d/ai-support-zabbix.conf' if zabbix_web_type == 'nginx' else '/etc/apache2/conf-enabled/ai-support-zabbix.conf' }}"
      register: zabbix_web_rollback_files

    - name: "zabbix_web : Save existing frontend settings privately"
      ansible.builtin.copy:
        src: "{{ item.item }}"
        dest: "{{ zabbix_web_rollback_dir.path }}/{{ item.item | hash('sha256') }}"
        remote_src: true
        mode: "0600"
      loop: "{{ zabbix_web_rollback_files.results }}"
      when: item.stat.exists
      diff: false

    - name: "zabbix_web : Deploy the dedicated PHP-FPM pool"
      ansible.builtin.copy:
        content: |
          [ai-support-zabbix]
          user = www-data
          group = www-data
          listen = /run/php/ai-support-zabbix.sock
          listen.owner = www-data
          listen.group = www-data
          pm = ondemand
          pm.max_children = 10
          pm.process_idle_timeout = 10s
          php_admin_value[memory_limit] = 128M
          php_admin_value[post_max_size] = 16M
          php_admin_value[max_execution_time] = 300
          php_admin_value[max_input_time] = 300
          php_admin_value[date.timezone] = {{ zabbix_web_php_timezone }}
        dest: "/etc/php/{{ zabbix_web_php_version }}/fpm/pool.d/ai-support-zabbix.conf"
        owner: root
        group: root
        mode: "0644"
      register: zabbix_web_pool

    - name: "zabbix_web : Configure frontend DB and server connections"
      ansible.builtin.copy:
        content: |
          <?php
          // Managed by ai-support-agent. Encoded password is decoded by PHP;
          // encoding prevents PHP string injection and is not encryption.
          $DB['TYPE'] = '{{ 'POSTGRESQL' if zabbix_web_db_type == 'postgresql' else 'MYSQL' }}';
          $DB['SERVER'] = '{{ zabbix_web_db_host }}';
          $DB['PORT'] = '{{ zabbix_web_db_port }}';
          $DB['DATABASE'] = '{{ zabbix_web_db_name }}';
          $DB['USER'] = '{{ zabbix_web_db_user }}';
          $DB['PASSWORD'] = base64_decode('{{ zabbix_web_db_password | b64encode }}');
          $DB['SCHEMA'] = '{{ 'public' if zabbix_web_db_type == 'postgresql' else '' }}';
          $ZBX_SERVER = '{{ zabbix_web_zbx_server_host }}';
          $ZBX_SERVER_PORT = '{{ zabbix_web_zbx_server_port }}';
          $ZBX_SERVER_NAME = '{{ zabbix_web_server_name }}';
          $IMAGE_FORMAT_DEFAULT = IMAGE_FORMAT_PNG;
          {% if zabbix_web_saml_enabled %}
          // SAML (ZABBIX.md). Certificates are files on 7.0 and 8.0 (8.0 would default to the database);
          // baseurl is fixed and proxy headers are not trusted. Certificate bodies are validated base64.
          $SSO['CERT_STORAGE'] = 'file';
          $SSO['IDP_CERT'] = '/etc/zabbix/web/saml/idp.crt';
          {% if zabbix_web_saml_sp_certificate | length > 0 %}
          $SSO['SP_KEY'] = '/etc/zabbix/web/saml/sp.key';
          $SSO['SP_CERT'] = '/etc/zabbix/web/saml/sp.crt';
          {% endif %}
          $SSO['SETTINGS'] = [
              'baseurl' => base64_decode('{{ zabbix_web_saml_public_url | b64encode }}'),
              'use_proxy_headers' => false,
              'strict' => true,
              'idp' => ['x509certMulti' => ['signing' => [
          {% for cert in zabbix_web_saml_idp_certificates %}
                  '{{ cert | regex_replace('-----(BEGIN|END) CERTIFICATE-----', '') | regex_replace('[^A-Za-z0-9+/=]', '') }}',
          {% endfor %}
              ]]],
          ];
          {% endif %}
        dest: /etc/zabbix/web/zabbix.conf.php
        owner: root
        group: www-data
        mode: "0640"
        validate: "php{{ zabbix_web_php_version }} -l %s"
      diff: false
      register: zabbix_web_frontend

    - name: "zabbix_web : Deploy the independent virtual host"
      ansible.builtin.template:
        src: "{{ zabbix_web_type }}.conf.j2"
        dest: "{{ '/etc/nginx/conf.d/ai-support-zabbix.conf' if zabbix_web_type == 'nginx' else '/etc/apache2/conf-enabled/ai-support-zabbix.conf' }}"
        owner: root
        group: root
        mode: "0644"
      register: zabbix_web_vhost

    - name: "zabbix_web : Validate the complete web server configuration"
      ansible.builtin.command:
        argv: "{{ ['nginx', '-t'] if zabbix_web_type == 'nginx' else ['apache2ctl', 'configtest'] }}"
      changed_when: false

    # Explicit service tasks are rescuable; handler failures during flush_handlers
    # must not escape the transaction or run after a caller rescues this role.
    - name: "zabbix_web : Record activation attempt"
      ansible.builtin.set_fact:
        zabbix_web_activation_started: true

    - name: "zabbix_web : Enable and start PHP-FPM"
      ansible.builtin.service:
        name: "php{{ zabbix_web_php_version }}-fpm"
        enabled: true
        state: started

    - name: "zabbix_web : Apply changed PHP settings and clear cached frontend config"
      ansible.builtin.service:
        name: "php{{ zabbix_web_php_version }}-fpm"
        state: restarted
      when: >-
        zabbix_web_pool.changed or zabbix_web_frontend.changed or
        (zabbix_web_locales | length > 0 and
         (zabbix_web_locale_fpm_started.stdout | trim | length == 0 or
          (zabbix_web_locale_fpm_started.stdout | trim | regex_replace('^@', '') | int)
          <= (zabbix_web_locale_archive_mtime.stdout | int)))

    - name: "zabbix_web : Enable and start the selected web server"
      ansible.builtin.service:
        name: "{{ 'nginx' if zabbix_web_type == 'nginx' else 'apache2' }}"
        enabled: true
        state: started

    - name: "zabbix_web : Read the web listener before applying"
      ansible.builtin.command:
        argv: [ss, -H, -lnt, "sport = :{{ zabbix_web_listen_port }}"]
      register: zabbix_web_listener_before
      changed_when: false
      when: zabbix_web_type == 'nginx'

    # A reload cannot move an nginx listener between the wildcard and a specific address on
    # the same port (either direction): the new bind fails with EADDRINUSE and nginx keeps
    # running the old configuration (observed on Ubuntu 26.04). Restart only when the port is
    # served but not on the configured local address; other vhost changes keep the graceful
    # reload so other sites on the same server are not interrupted. Other listeners on the port
    # (e.g. [::]:<port> of another server block) do not force a restart; with a loopback address
    # the listener assert after the health check still rejects them. No listener = reload adds it.
    - name: "zabbix_web : Apply the web configuration"
      ansible.builtin.service:
        name: "{{ 'nginx' if zabbix_web_type == 'nginx' else 'apache2' }}"
        state: "{{ 'restarted' if zabbix_web_listener_differs else 'reloaded' }}"
      vars:
        # ss -H -lnt columns: State Recv-Q Send-Q Local Peer. Compare the Local column only.
        zabbix_web_listener_differs: >-
          {{ zabbix_web_type == 'nginx'
             and (zabbix_web_listener_before.stdout_lines | length) > 0
             and ((zabbix_web_listen_address or '0.0.0.0') ~ ':' ~ (zabbix_web_listen_port | string))
                 not in (zabbix_web_listener_before.stdout_lines | map('split') | map(attribute=3) | list) }}

    - name: "zabbix_web : Verify the login page, not the setup wizard or a DB error"
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ zabbix_web_listen_port }}/index.php"
        headers:
          Host: "{{ zabbix_web_server_name }}"
        return_content: true
        follow_redirects: none
      register: zabbix_web_health
      changed_when: false
      retries: 10
      delay: 3
      until:
        - zabbix_web_health.status | default(0) == 200
        - "'name=\"name\"' in (zabbix_web_health.content | default(''))"
        - "'name=\"password\"' in (zabbix_web_health.content | default(''))"
        - "'setup.php' not in (zabbix_web_health.location | default(''))"

    - name: "zabbix_web : Read the actual web listener"
      ansible.builtin.command:
        argv: [ss, -H, -lnt, "sport = :{{ zabbix_web_listen_port }}"]
      register: zabbix_web_listener
      changed_when: false
      when: zabbix_web_listen_address | length > 0

    - name: "zabbix_web : Require the actual web listener to match zabbix_web_listen_address"
      ansible.builtin.assert:
        that:
          - zabbix_web_listener.stdout_lines | length == 1
          - zabbix_web_listener.stdout_lines[0].split()[3] == zabbix_web_listen_address ~ ':' ~ (zabbix_web_listen_port | string)
        fail_msg: >-
          The web server does not listen only on {{ zabbix_web_listen_address }}:{{ zabbix_web_listen_port }}.
          The previous frontend settings are restored.
      when: zabbix_web_listen_address | length > 0

    - name: "zabbix_web : Mark successful frontend setup"
      ansible.builtin.set_fact:
        zabbix_web_rollback_complete: true

  rescue:
    - name: "zabbix_web : Restore existing frontend settings"
      ansible.builtin.copy:
        src: "{{ zabbix_web_rollback_dir.path }}/{{ item.item | hash('sha256') }}"
        dest: "{{ item.item }}"
        remote_src: true
        owner: "{{ item.stat.uid }}"
        group: "{{ item.stat.gid }}"
        mode: "{{ item.stat.mode }}"
      loop: "{{ zabbix_web_rollback_files.results }}"
      when: item.stat.exists
      diff: false

    - name: "zabbix_web : Remove newly created frontend settings"
      ansible.builtin.file:
        path: "{{ item.item }}"
        state: absent
      loop: "{{ zabbix_web_rollback_files.results }}"
      when: not item.stat.exists

    - name: "zabbix_web : Restore previous PHP-FPM service state and clear cached config"
      ansible.builtin.service:
        name: "php{{ zabbix_web_php_version }}-fpm"
        state: "{{ 'restarted' if zabbix_web_services.ansible_facts.services['php' ~ zabbix_web_php_version ~ '-fpm.service'].state == 'running' else 'stopped' }}"
        enabled: "{{ (zabbix_web_services.ansible_facts.services['php' ~ zabbix_web_php_version ~ '-fpm.service'].status == 'enabled') if zabbix_web_services.ansible_facts.services['php' ~ zabbix_web_php_version ~ '-fpm.service'].status in ['enabled', 'disabled'] else omit }}"
      when: zabbix_web_activation_started | default(false)

    - name: "zabbix_web : Restore previous web service state and loaded configuration"
      ansible.builtin.service:
        name: "{{ 'nginx' if zabbix_web_type == 'nginx' else 'apache2' }}"
        state: "{{ ('restarted' if zabbix_web_vhost.changed | default(false) else 'reloaded') if zabbix_web_services.ansible_facts.services[('nginx' if zabbix_web_type == 'nginx' else 'apache2') ~ '.service'].state == 'running' else 'stopped' }}"
        enabled: "{{ (zabbix_web_services.ansible_facts.services[('nginx' if zabbix_web_type == 'nginx' else 'apache2') ~ '.service'].status == 'enabled') if zabbix_web_services.ansible_facts.services[('nginx' if zabbix_web_type == 'nginx' else 'apache2') ~ '.service'].status in ['enabled', 'disabled'] else omit }}"
      when: zabbix_web_activation_started | default(false)

    - name: "zabbix_web : Mark completed rollback"
      ansible.builtin.set_fact:
        zabbix_web_rollback_complete: true

    - name: "zabbix_web : Report frontend configuration failure"
      ansible.builtin.fail:
        msg: >-
          Frontend setup failed. Previous frontend settings were restored;
          any attempted service activation was reverted to the previous state.

  always:
    - name: "zabbix_web : Remove private rollback backups after success or completed rollback"
      ansible.builtin.file:
        path: "{{ zabbix_web_rollback_dir.path }}"
        state: absent
      when: zabbix_web_rollback_complete | default(false)
      # Keep the root-only backup if rollback itself failed, for manual recovery.

# ufw 収束（設計書 §3.6 / §3.6.1）。フロントエンド設定のロールバック block の外・後に置く:
#   * ufw の失敗はフロントエンド設定のロールバック対象ではない（設定は正常に反映済みで、
#     巻き戻す理由が無い）。block の中に置くと ufw の失敗で正しい設定まで戻してしまう。
#   * 管理者パスワードの変更（設計書 §4.2）は、この ufw より前に置く（下の api.yml）。
#     初期パスワードのまま外部へ開けない順序にするため、ufw は main.yml の末尾に置く。
#
# 管理者パスワード・ハウスキーピング（設計書 §4.2）と、API トークン・SAML（ZABBIX.md「SAML（SSO）」。
# SAML は zabbix_web_api_token か zabbix_web_admin_password を必須にしているので、この条件で include される）。
# ロールバック block の外・後に置く:
#   * 失敗の原因は設定ファイルではなく、フロントエンド設定のロールバックで直る種類の失敗ではない
#   * user.update は単一の API 呼び出しで部分的な状態が残らず、戻す先は初期パスワードになる
# ufw より前に置くので、パスワード変更に失敗した実行では 8080 を新たに開けない。
# SAML を無効にしたら証明書のディレクトリを消す（zabbix.conf.php は上の block で $SSO の無い内容に戻っている）。
# 以前にこのロールで SAML を設定したホストで、トークン無しに無効にしたときは DB の SAML の状態を変えられないので警告する。
- name: "zabbix_web : Read the SAML certificate directory"
  ansible.builtin.stat:
    path: /etc/zabbix/web/saml
    get_checksum: false
    get_mime: false
  register: zabbix_web_saml_dir
  when: not zabbix_web_saml_enabled

- name: "zabbix_web : Remove SAML certificates after SAML is disabled"
  ansible.builtin.file:
    path: /etc/zabbix/web/saml
    state: absent
  when:
    - not zabbix_web_saml_enabled
    - zabbix_web_saml_dir.stat.exists | default(false)

- name: "zabbix_web : Warn that SAML stays enabled in the database without an API token"
  ansible.builtin.debug:
    msg: >-
      zabbix_web_saml_enabled is false but zabbix_web_api_token is empty, so this run removed the SAML
      settings from zabbix.conf.php but did not change the SAML authentication switch in the database.
      Set zabbix_web_api_token to turn SAML authentication off through the API.
  when:
    - not zabbix_web_saml_enabled
    - zabbix_web_saml_dir.stat.exists | default(false)
    - zabbix_web_api_token | length == 0

- name: "zabbix_web : Converge the admin password and housekeeping"
  ansible.builtin.include_tasks: api.yml
  when: zabbix_web_admin_password | length > 0 or zabbix_web_housekeeping | length > 0 or zabbix_web_api_token | length > 0

- name: "zabbix_web : Warn while SAML runs without the Admin lockdown or with legacy users allowed"
  ansible.builtin.debug:
    msg: >-
      SAML is enabled but the setup is not final: zabbix_web_admin_lockdown is false (Admin can still sign
      in with a password) or zabbix_web_saml_allow_legacy_users is true (non-SAML users with e-mail-like
      names can sign in through SAML). Finish the steps in ZABBIX.md.
  when:
    - zabbix_web_saml_enabled
    - not zabbix_web_admin_lockdown or zabbix_web_saml_allow_legacy_users

- name: "zabbix_web : Read the one-time service user token file"
  ansible.builtin.stat:
    path: /var/lib/ai-support-zabbix/service-user-token
    get_checksum: false
    get_mime: false
  register: zabbix_web_saml_token_file
  when: zabbix_web_api_token | length > 0

- name: "zabbix_web : Warn that the one-time service user token file still exists"
  ansible.builtin.debug:
    msg: >-
      /var/lib/ai-support-zabbix/service-user-token still exists although zabbix_web_api_token is set.
      Delete the file; the token belongs only in the secret variable.
  when:
    - zabbix_web_api_token | length > 0
    - zabbix_web_saml_token_file.stat.exists | default(false)

- name: "zabbix_web : Warn that the initial admin password may be exposed"
  ansible.builtin.debug:
    msg: >-
      zabbix_web_admin_password is empty while zabbix_web_allowed_sources is set, so the
      Zabbix frontend may be reachable with the initial Admin password. Set
      zabbix_web_admin_password from an ANSIBLE# secret variable to manage it with this role.
  when:
    - zabbix_web_admin_password | length == 0
    - zabbix_web_allowed_sources | length > 0

- name: "zabbix_web : Warn that the web port is not opened by this role"
  ansible.builtin.debug:
    msg: >-
      zabbix_web_allowed_sources is empty, so port {{ zabbix_web_listen_port }}/tcp
      is NOT opened by this role (any rule this role opened earlier is closed). List the
      operator networks in zabbix_web_allowed_sources; set zabbix_web_allow_no_sources: false
      to make an empty list fail instead.
  when:
    - zabbix_web_ufw_manage | bool
    - zabbix_web_allowed_sources | length == 0

- name: "zabbix_web : Converge the firewall rules"
  ansible.builtin.include_tasks: ufw.yml
  when: zabbix_web_ufw_manage | bool
