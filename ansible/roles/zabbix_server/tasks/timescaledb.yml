---
# TimescaleDB のローカル導入（設計書 §4.1「TimescaleDB」）。main.yml から、
# db_mode: local かつ zabbix_server_db_timescaledb: true のときだけ、`database.py --plan`
# の後に include される。既存 DB に対する不正な指定（通常 DB に true 等）は --plan が
# ここより前で落とすため、このファイルの PostgreSQL 設定変更・再起動には到達しない。
#
# リポジトリ URL・鍵指紋・版の範囲はすべてこのファイル内のリテラルで固定する（§3.7）。
# ロール変数にすると、レシピの task vars で取得元や版を差し替えられる。

- name: "zabbix_server : Read the local PostgreSQL server version"
  ansible.builtin.command:
    argv: [psql, -XAtc, SHOW server_version_num]
  become_user: postgres
  register: zabbix_server_pg_major
  changed_when: false

# Timescale のパッケージは PostgreSQL メジャーごとに分かれる。Ubuntu 同梱以外のメジャー
# （PGDG 等）が動いている構成は想定外として止める（fail-closed）。
- name: "zabbix_server : Require the PostgreSQL major version shipped with this Ubuntu release"
  ansible.builtin.assert:
    that:
      - zabbix_server_pg_major.stdout | trim is match('^[0-9]{5,6}\Z')
      - (zabbix_server_pg_major.stdout | trim | int) // 10000 == (14 if ansible_distribution_version == '22.04' else 16)
    fail_msg: >-
      TimescaleDB setup supports only the PostgreSQL major version shipped with Ubuntu
      (14 on 22.04, 16 on 24.04), but the local PostgreSQL server runs another major version.

- name: "zabbix_server : Install gpg to verify the Timescale repository key"
  ansible.builtin.apt:
    name: gnupg
    state: present

- name: "zabbix_server : Create the APT keyring directory"
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: "zabbix_server : Download the Timescale repository signing key"
  ansible.builtin.get_url:
    url: https://packagecloud.io/timescale/timescaledb/gpgkey
    dest: /etc/apt/keyrings/timescaledb.asc
    owner: root
    group: root
    mode: "0644"

- name: "zabbix_server : Read the Timescale repository key fingerprints"
  ansible.builtin.command:
    argv: [gpg, --batch, --show-keys, --with-colons, /etc/apt/keyrings/timescaledb.asc]
  register: zabbix_server_ts_key
  changed_when: false

# 主鍵と署名用副鍵の指紋（2026-10-13 に https://packagecloud.io/timescale/timescaledb/gpgkey
# から取得して採取）。鍵ファイルに別の鍵が混ざっていても一致しない（全指紋の列で比較する）。
# 既に置かれた鍵ファイルも毎回検査する（get_url は既存ファイルを再取得しない）。
# 後方参照の書き方: assert の that（条件式）では '\\1'、set_fact 等のテンプレートでは '\1'
# （ansible-core 2.17 で実測。テンプレートだけ Ansible がバックスラッシュを二重化してから評価する）。
- name: "zabbix_server : Require the pinned Timescale repository key"
  ansible.builtin.assert:
    that:
      - >-
        zabbix_server_ts_key.stdout_lines | select('match', '^fpr:')
        | map('regex_replace', '^fpr:+([0-9A-F]{40}):.*$', '\\1') | list
        == ['1005FB68604CE9B8F6879CF759F18EDF47F24417', '0641009A8366FDE4444A7B62E7391C94080429FF']
    fail_msg: >-
      /etc/apt/keyrings/timescaledb.asc is not the pinned Timescale packagecloud signing key.
      Do not add the repository; inspect the key file (it may have been replaced or rotated).

- name: "zabbix_server : Configure the Timescale repository"
  ansible.builtin.copy:
    content: |
      Types: deb
      URIs: https://packagecloud.io/timescale/timescaledb/ubuntu/
      Suites: {{ 'noble' if ansible_distribution_version == '24.04' else 'jammy' }}
      Components: main
      Architectures: {{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}
      Signed-By: /etc/apt/keyrings/timescaledb.asc
    dest: /etc/apt/sources.list.d/timescaledb.sources
    owner: root
    group: root
    mode: "0644"

# 毎回更新する（前回の実行がリポジトリ追加直後に失敗していても候補を取得できるように）。
# 索引の更新は状態の変更として数えない（毎回 changed になり冪等性の確認を妨げるため）。
- name: "zabbix_server : Refresh the package index"
  ansible.builtin.apt:
    update_cache: true
  changed_when: false

- name: "zabbix_server : List the available TimescaleDB versions"
  ansible.builtin.command:
    argv: [apt-cache, madison, "timescaledb-2-postgresql-{{ '14' if ansible_distribution_version == '22.04' else '16' }}"]
  register: zabbix_server_ts_candidates
  changed_when: false

- name: "zabbix_server : Read the installed TimescaleDB version"
  ansible.builtin.command:
    argv: [dpkg-query, -W, "-f=${Status}|${Version}", "timescaledb-2-postgresql-{{ '14' if ansible_distribution_version == '22.04' else '16' }}"]
  register: zabbix_server_ts_installed
  changed_when: false
  failed_when: zabbix_server_ts_installed.rc not in [0, 1]

# 版の範囲 2.13〜2.28 はロール内リテラル。下限は Zabbix 7.0 の対応下限、上限は Zabbix 6.0 の
# 最新マイナー（6.0.48。2026-10-13 時点）が起動を許す上限（2.29 では
# "Unsupported DB! timescaledb version 22902 is newer than maximum allowed 22899" で起動を拒否する。
# 実測）。範囲内の最新を選ぶ。同じスイートに別ディストリビューション向けのビルド
# （noble に ~ubuntu22.04 版）が混在するため、版文字列のディストリビューションも一致させる。
# apt-cache madison は新しい版から順に並ぶ。
# 既に導入済みなら、範囲内である限りその版を維持する（拡張の版を上げるには
# ALTER EXTENSION timescaledb UPDATE が要り、手作業とする）。範囲外なら下の assert で止め、
# 上げも下げもしない。
- name: "zabbix_server : Select the TimescaleDB version"
  ansible.builtin.set_fact:
    zabbix_server_ts_version: >-
      {{ (zabbix_server_ts_installed.stdout.split('|', 1)[1]
          if zabbix_server_ts_installed.stdout is match('^install ok installed[|]')
          else (zabbix_server_ts_candidates.stdout_lines
                | map('regex_replace', '^[^|]*[|]\s*([^|\s]+)\s*[|].*$', '\1')
                | select('match', '^2\.(1[3-9]|2[0-8])\.')
                | select('search', '~ubuntu' ~ (ansible_distribution_version | regex_escape) ~ '(-[0-9]+)?$')
                | first | default(''))) | trim }}

- name: "zabbix_server : Require a TimescaleDB version supported by Zabbix 6.0 and 7.0"
  ansible.builtin.assert:
    that:
      - zabbix_server_ts_version is match('^2\.(1[3-9]|2[0-8])\.')
    fail_msg: >-
      No TimescaleDB 2.13-2.28 package for this Ubuntu release is available, or the installed
      TimescaleDB package is outside 2.13-2.28. This role never upgrades or downgrades an
      installed TimescaleDB; change it manually (apt and ALTER EXTENSION timescaledb UPDATE).

- name: "zabbix_server : Pin the TimescaleDB packages to the selected version"
  ansible.builtin.copy:
    content: |
      # Managed by ai-support-agent. TimescaleDB upgrades are manual: apt, then
      # ALTER EXTENSION timescaledb UPDATE in every database that uses it.
      Package: timescaledb-2-postgresql-{{ '14' if ansible_distribution_version == '22.04' else '16' }} timescaledb-2-loader-postgresql-{{ '14' if ansible_distribution_version == '22.04' else '16' }}
      Pin: version {{ zabbix_server_ts_version }}
      Pin-Priority: 1001
    dest: /etc/apt/preferences.d/ai-support-timescaledb
    owner: root
    group: root
    mode: "0644"

- name: "zabbix_server : Install the TimescaleDB Community packages"
  ansible.builtin.apt:
    name:
      - "timescaledb-2-postgresql-{{ '14' if ansible_distribution_version == '22.04' else '16' }}={{ zabbix_server_ts_version }}"
      - "timescaledb-2-loader-postgresql-{{ '14' if ansible_distribution_version == '22.04' else '16' }}={{ zabbix_server_ts_version }}"
    state: present
    install_recommends: false

- name: "zabbix_server : Read the running shared_preload_libraries"
  ansible.builtin.command:
    argv: [psql, -XAtc, SHOW shared_preload_libraries]
  become_user: postgres
  register: zabbix_server_ts_preload
  changed_when: false

# ALTER SYSTEM（postgresql.auto.conf）で既存の値と合流させる。conf.d のドロップインは
# 値全体が後勝ちで上書きされ、既存の pg_stat_statements 等が消えるため採らない。
# postgresql_set はカンマ区切りを要素ごとに分けて設定し、実行中の値（SHOW）と比較する。
# 比較対象が実行中の値なので、前回の実行で設定後の再起動に失敗していても、timescaledb が
# 読み込まれるまで毎回 changed になり、下の再起動が走る（pending の回復）。
# 区切りは postgresql_set の比較形式（", "）に揃える（揃えないと毎回 changed になる）。
- name: "zabbix_server : Add timescaledb to shared_preload_libraries, keeping existing entries"
  community.postgresql.postgresql_set:
    name: shared_preload_libraries
    value: >-
      {{ ((zabbix_server_ts_preload.stdout | trim).split(',') | map('trim') | map('regex_replace', '^"(.*)"$', '\1')
          | reject('equalto', '') | list + ['timescaledb']) | unique | join(', ') }}
  become_user: postgres
  register: zabbix_server_ts_pending

# handler ではなくその場で再起動する（拡張の作成と初期投入はこの後に続くため）。
# 同じホストの他の DB も一時停止する。
- name: "zabbix_server : Restart PostgreSQL to load TimescaleDB"
  ansible.builtin.service:
    name: postgresql
    state: restarted
  when: zabbix_server_ts_pending.changed

- name: "zabbix_server : Wait for PostgreSQL to accept connections"
  ansible.builtin.command:
    argv: [pg_isready, -q]
  become_user: postgres
  register: zabbix_server_pg_ready
  changed_when: false
  failed_when: false
  retries: 30
  delay: 2
  until: zabbix_server_pg_ready.rc == 0

- name: "zabbix_server : Fail if PostgreSQL did not come back"
  ansible.builtin.fail:
    msg: >-
      PostgreSQL did not accept connections after loading TimescaleDB. Check
      journalctl -u postgresql@*-main and the PostgreSQL log (shared_preload_libraries is set
      in postgresql.auto.conf).
  when: zabbix_server_pg_ready.rc != 0

# 空 DB（と、前回 TimescaleDB の投入だけが失敗した DB）のときだけ作る。--plan の state で判定する。
- name: "zabbix_server : Create the TimescaleDB extension in the empty Zabbix DB"
  community.postgresql.postgresql_ext:
    name: timescaledb
    login_db: "{{ zabbix_server_db_name }}"
    schema: public
    cascade: true
  become_user: postgres
  when: (zabbix_server_db_plan.stdout | from_json).state in ['empty', 'timescaledb_pending']

# timescaledb.telemetry_level は、拡張を作成した DB に接続したときにしか存在しない（preload
# されるのはローダーで、版付きのライブラリは拡張のある DB で読み込まれる。実測）。そのため
# 拡張の作成の後に、Zabbix DB へ接続して設定する。ALTER SYSTEM なのでクラスタ全体に効き、
# context: user なので postgresql_set の reload で反映される。
- name: "zabbix_server : Turn off TimescaleDB telemetry"
  community.postgresql.postgresql_set:
    name: timescaledb.telemetry_level
    value: "off"
    login_db: "{{ zabbix_server_db_name }}"
  become_user: postgres
